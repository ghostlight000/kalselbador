.logo{width:min(680px,94vw);height:auto;display:block;margin:0 auto;overflow:visible;animation:lgin 2.4s cubic-bezier(.2,.7,.2,1) both}
.lg-core{animation:lgpulse 6s ease-in-out infinite}.lg-sp{animation:lgtw 5s ease-in-out infinite}@keyframes lgtw{0%,100%{opacity:.35}50%{opacity:.8}}.ti button.p{transition:background .35s,color .35s,box-shadow .35s}.ti button.p:hover{background:var(--a);color:var(--bg);border-color:var(--al);box-shadow:0 0 18px var(--g)}
@keyframes lgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes lgpulse{0%,100%{opacity:.7}50%{opacity:1}}
:root[data-theme=light] .lg-t{stroke-opacity:.12;filter:none!important}:root[data-theme=light] .lg-sun{filter:brightness(.72) saturate(1.2)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .lg-t{stroke-opacity:.12;filter:none!important}}
.lgh{margin:0;font-size:inherit;line-height:1;text-shadow:none;animation:none}.lgh .lgk{display:block;text-align:center}

.mv,.mdk{display:none}
@media(max-width:600px){
body{font-size:15px}
main{padding:8px 14px calc(72px + env(safe-area-inset-bottom))}
.tbar{display:flex;justify-content:flex-end;gap:4px}.tbar button{font-size:12px;padding:3px 10px;margin:0}
.mv{display:block;position:sticky;top:0;z-index:20;margin:4px -14px 8px;padding:6px 14px 6px;background:var(--bg);border-bottom:1px solid var(--b);box-shadow:0 6px 12px -10px rgba(0,0,0,.5)}
.mvb{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}

body{background:radial-gradient(ellipse at 50% -10%,rgba(184,154,98,.06),transparent 60%),var(--bg)}
body::before{z-index:60;opacity:.06;mix-blend-mode:overlay}
h2{border-bottom:1px solid var(--b);padding-bottom:4px;letter-spacing:.06em}
h1{text-shadow:none}
/* 패널 */
.bx{border:1px solid transparent;border-radius:0;border-image:var(--sv-panel) 12 fill / 12px stretch;background:none;padding:12px 14px 10px;margin:0 0 10px}
.bx>.lg,.lg{position:static;display:block;background:none;padding:0 0 6px;margin:0 0 10px;border-bottom:1px solid var(--b);font-size:15px;color:var(--a);letter-spacing:.06em}
.card{border:1px solid transparent;border-radius:0;border-image:var(--sv-card) 12 fill / 12px stretch;background:none;box-shadow:none;color:var(--t)}
.ov .card{filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.card::before,.card::after{width:9px;height:9px;margin-left:-4.5px;background:var(--a);border:0}.card::before{top:-4.5px}.card::after{bottom:-4.5px}
.qc{border:1px solid transparent;border-radius:0;border-image:var(--sv-qc) 10 fill / 10px stretch;background:none;color:var(--t);padding:10px 14px;margin:0 0 8px;filter:drop-shadow(3px 3px 0 rgba(120,95,60,.32))}
.qc.mn{border-left:1px solid transparent;background:none}
.qc .m{color:var(--m)}
/* 버튼 */
button:where(:not(.sg,.ic,.pi)){border:1px solid transparent;border-radius:0;background:none;border-image:var(--sv-btn) 8 fill / 8px stretch;box-shadow:none}
button:where(:not(.sg,.ic,.pi,.p,.act)):hover:not(:disabled){border-image-source:var(--sv-btnh)}
button.on:where(:not(.sg,.ic,.pi)),.pb.on,.ar.on{border-image-source:var(--sv-btnon)}
button.p,.ab.p,button.act{border-image-source:var(--sv-pri);color:var(--bg)}
.card button.p,.qc button.p,.card .ab.p{color:#f1e8d6}
button.p:hover:not(:disabled),button.act:hover:not(:disabled){border-image-source:var(--sv-prih);color:var(--bg);background:none;box-shadow:none}
.card button.p:hover:not(:disabled){color:#f1e8d6}
button:disabled{cursor:default}
.ti button.p:hover{box-shadow:none}
.mdk button{border:0;border-image:none!important}
.mdk{background:var(--bg);border-top:1px solid var(--b)}
.mdk button.on{box-shadow:inset 0 2px 0 var(--a)}
.mv{background:var(--bg);border-bottom:1px solid var(--b);box-shadow:none}
.stopb{border-image-source:none!important;border:1px solid rgba(187,90,64,.45)!important;color:var(--bad);clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}
.ar{padding:9px 12px}
.ar .cf,.ab .cf{background:var(--g)}
:root[data-theme=light] .ar .cf,:root[data-theme=light] .ab .cf{background:rgba(110,80,40,.24)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .ar .cf,:root:not([data-theme=dark]) .ab .cf{background:rgba(110,80,40,.24)}}
:root:not([data-theme=light]) .ar .cf{background:rgba(184,154,98,.16)}
.tbar button{padding:4px 10px}
/* 리본 태그 */
.tg{border:0;border-radius:0;background:var(--rust);color:#efe5d2;padding:1px 15px 1px 9px;font-size:12px;letter-spacing:.04em;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%)}
.qc.mn .tg,.tg.mn{background:#7d5f31}
.tg.rp{background:#5c5246}
/* 게이지 */
.bar{height:6px;background:var(--gauge);box-shadow:inset 0 0 0 1px var(--b);border-radius:1px}
.bar i{box-shadow:none;border-radius:0}
.hp i{background:var(--rust)} .cd i{background:var(--slate)} .tl i{background:var(--sage)} .hu i{background:#a5844f} .xp i{background:var(--a);opacity:.75}
/* 칩·구획 */
.mch,.dch,.chip{border-radius:0;background:none;border:1px solid transparent;border-image:var(--sv-chip) 4 fill / 4px stretch}
.dch{padding:2px 10px}
.acds{border-top:1px solid var(--b)}
.seg{border:1px solid var(--b);border-radius:0;clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.seg .sg.on{background:var(--a);color:var(--c)}
.card .seg .sg.on{background:#7d5f31;color:#f1e8d6}
.dl{border:0;border-top:1px solid var(--b);border-radius:0;padding:6px 0 4px;margin:8px 0 0}
.dl:not([open]){padding:0}
.dl>summary::before{content:'◇ ';font-size:11px;vertical-align:1px}
.dl[open]>summary::before{content:'◆ ';font-size:11px;vertical-align:1px}
.bgc .row{padding:2px 0}
/* 장면·지도 */
.scw,.mapw{border:6px solid transparent;border-radius:0;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);border-image:var(--sv-panel) 12 / 12px stretch;background-clip:padding-box}
.mapw .mapc{top:6px;right:6px}
.mapw{background:radial-gradient(circle at 50% 40%,var(--g),transparent 75%),var(--c2)}
.locb{border-bottom:1px solid var(--b)}
.evp{border-bottom:1px solid var(--b)}
.ov{background:rgba(14,12,10,.72)}
.av{border-radius:0;clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px);background:var(--c2)}
.pq{border-left:0}
.plc{border-top:1px solid var(--b)}
.pn{border-radius:0}
.bsk{border:1px solid transparent;border-image:var(--sv-panel) 12 fill / 12px stretch;background:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.bsk h2{color:var(--a)}

button.p:hover:not(:disabled),.ab.p:hover:not(:disabled){border-image-source:var(--pbh)!important;color:var(--pbt)!important;background:none}
button.p::before,button.p::after,.ab.p::before,.ab.p::after{content:"";position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;background:var(--pst) center/contain no-repeat;pointer-events:none}
button.p:hover:not(:disabled)::before,button.p:hover:not(:disabled)::after,.ab.p:hover:not(:disabled)::before,.ab.p:hover:not(:disabled)::after{background-image:var(--psth)}
button.p::before,.ab.p::before{left:-13px}
button.p::after,.ab.p::after{right:-13px}
button.p:disabled,.ab.p:disabled{opacity:.4}
.ab.p.sm{padding:3px 18px}
.ab.p.sm::before,.ab.p.sm::after{width:19px;height:19px;margin-top:-9.5px}
.ab.p.sm::before{left:-9.5px}.ab.p.sm::after{right:-9.5px}

.acdh+.acds{border-top:0;padding-top:2px}

<script>

// ============================================================
// 0. 오류 안전망 — 불러오기 중 오류가 나면 빈 화면 대신 안내를 띄운다
// ============================================================
if(typeof window!='undefined')window.addEventListener('error',e=>{const a=document.getElementById('app');if(!a||a.innerHTML.trim())return;a.innerHTML=`<div class=card style='margin-top:40px'><h2>불이 꺼졌다</h2><p>여정을 불러오다 문제가 생겼다.</p><p class=m>${String(e.message||'').replace(/</g,'&lt;')}</p><p><button onclick='location.reload()'>다시 불러온다</button> <button onclick="try{localStorage.setItem('kalsel1_bak',localStorage.getItem('kalsel1')||'');localStorage.removeItem('kalsel1')}catch(_){}location.reload()">저장을 따로 보관하고 새로 시작</button></p></div>`});
// ============================================================
// 1. 데이터 · 상수 · 상태 변수 — 실행 순서가 중요한 구역 (위에서 아래로 정의됨)
//    여기서는 함수만 호출하고, 저장된 게임(S)이나 화면에는 손대지 않는다
// ============================================================
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),K='kalsel1';
const SN=['힘','마력','정신','손재주'],KN=['전투','채집','제작','주술','연금술'],TB=['마을','화톳불','시장','작업장','외곽','의뢰'];
// 종족: s=기본 능력치(합 14), o=[출신,설명,능력치 보정(합 3),시작 기술]
const RACE={
p:{n:'파볼릭',d:'용의 핏줄을 이은 거인종. 마력을 타고났고 힘을 갈망하며, 설산 위 성벽 도시에 산다.',s:[4,6,2,2],st:'r',l:'키 2미터에서 큰 개체는 3~4미터에 이르는 거인종. 두꺼운 살갗 덕에 추위에 강하고, 만년설이 쌓인 산 위에서 산다. 신이 용과 정을 맺어 낳았다는 말이 있을 만큼 용의 핏줄을 긍지로 삼아, 드래곤을 경외하면서도 죽이려는 열망을 품는다. 호전적이지만 필요 없는 싸움은 하지 않고, 독선적이며 타 종족을 깔본다. 마력과 힘이 높고 정신과 손재주는 낮은 편이다.',t:[['남색 서리비늘','얼음과 물의 마법에 밝은 계통. 추위는 이들에게 오히려 힘이다.',.4,3,'frost',[0,0,1,0],'푸른 비늘을 지닌 계통. 얼음과 물의 마법에 밝아 설산의 추위 속에서 오히려 힘을 얻는다. 차분한 이가 많아 파볼릭 중에서는 드물게 말이 통한다는 평을 듣는다.'],['흑금 방계','왕족의 먼 핏줄. 오만하고, 왕좌를 노린다는 소문이 따라붙는다.',.6,0,'gem',[1,0,0,0],'왕족의 먼 곁가지. 검은 바탕에 금빛이 도는 비늘은 왕좌를 향한 야심의 상징이다. 오만하고 힘을 숭상하며, 서로 감시하는 높은 이들 틈에서 살아남는다.'],['무색 비늘','마력이 희미해 배척받는 이들. 들키면 죽기에 일찍 손기술을 익혔다.',.6,2,'ore',[0,0,0,1],'마력이 희미하게 태어나 배척받는 이들. 들키면 목숨이 위태로워 몸을 숨기고, 마력 대신 손기술로 쓸모를 증명해 왔다.'],['적동 번개비늘','번개와 불을 다루는 칼라쉬가 많이 나는 계통.',.5,3,'gem',[0,1,0,0],'붉은 구릿빛 비늘을 지닌 계통. 비늘 색이 곧 마법의 결이라, 번개와 불을 다루는 칼라쉬가 이 핏줄에서 가장 많이 나온다. 성미가 급하고, 가문 안의 서열 다툼이 가장 치열하다.'],['성벽 여가장 가문','대대로 여가장이 성벽 한 구간을 지켜 온 집안.',.5,0,'hide',[0,0,1,0],'파볼릭은 여성이 더 크고 지위가 높은 모계 사회다. 이 가문은 대대로 여가장이 레타시아 성벽의 한 구간을 맡아 지켜 왔고, 규율과 체면을 목숨보다 무겁게 여긴다.']],o:[
['칼라쉬','자연 마법에 특화되어 추앙받는 엘리트 마법사 계급.',[0,2,1,0],3,'자연 마법을 다루는 파볼릭의 엘리트 마법사 계급. 존경과 추앙을 받지만 그만큼 기대와 시선이 무겁다.'],
['프라우릴케','마법을 정화·무효화하는 왕의 정예병.',[1,1,1,0],0,'마법을 정화하고 무효화하는 왕의 정예병. 마법사들이 두려워하는 존재로, 칼날과 마력 저항으로 왕을 지킨다.'],

i:{n:'잉그라드',d:'짐승의 머리를 한 유랑 부족. 자연과 신을 섬기며 말수가 적다.',s:[3,2,6,3],st:'g',l:'짐승의 머리를 한 유랑 부족으로, 수인족이라고도 불린다. 작은 부락을 이루고 신을 섬기는 것을 삶의 의미로 삼는다. 칼셀바도르 이전에는 짐승 취급을 받았고, 변두리 인간들에게는 지금도 그렇다. 마법을 쓰는 이는 극소수로 샤멘이라 불리며 영혼과 저주, 강령술만 쓸 수 있다. 말수가 적고 스스로를 가장 신에 가까운 종족이라 자부한다. 정신이 매우 높고 힘과 마력은 낮은 편이다.',t:[['서리갈기 부족','설원을 떠도는 사냥꾼 부락. 눈 위의 발자국을 읽는다.',.7,0,'hide',[1,0,0,0],'설원을 떠도는 사냥꾼 부락. 눈 위의 발자국과 바람의 냄새를 읽고, 짐승 취급을 받아 온 세월만큼 거칠고 끈질기다.'],['재의 부족','굶주린 겨울마다 죽은 자를 일으켜 버틴 부락. 누구도 곁에 앉지 않는다.',.9,3,'bone',[0,1,0,0],'굶주린 겨울마다 죽은 자를 일으켜 버텨 온 부락. 다른 부족이 곁에 앉기를 꺼리지만, 영혼의 길을 아는 것도 그들뿐이다.'],['노래하는 바람 부족','신께 바치는 노래를 지키는 부락. 노래로 한기를 쫓는다.',.6,1,'herb',[0,0,1,0],'신께 바치는 노래를 지켜 온 부락. 노래로 한기를 쫓고 길 잃은 영혼을 달랜다. 말수는 적어도 노래만큼은 아끼지 않는다.'],['키야라드의 부족','연합 부족장과 최고 샤멘을 모시는 부족.',.7,3,'herb',[0,0,1,0],'연합 부족장 알야세르카가 나온 부족. 교황과도 같은 권위를 지닌 최고 샤멘 키야라드를 모시며 계율이 가장 엄격하다. 다른 부족들은 이들 앞에서 고개를 숙이지만, 속으로는 두려워한다.'],['하칸 문양 부족','새하얀 강철 하칸에 문양을 칠하는 장인 부락.',.7,2,'ore',[0,0,0,1],'새하얀 강철 하칸을 벼려 그 위에 부족의 문양을 칠하는 부락. 카심들의 무기는 대부분 이들 손에서 나온다. 문양 하나하나에 부족이 겪은 겨울을 새긴다고 한다.']],o:[

const HELP=[["세계", "<h2>칼셀바도르</h2><p>아주 오래전 마법사들이 하늘에서 불을 가져왔다. 사람도, 용의 핏줄도, 짐승의 머리를 한 이들도 그 불빛이 드리운 그림자일 뿐이라고 한다.</p><p>불이 약해지자 영원한 추위, <b>칼셀바도르</b>가 내렸다. 곡식은 얼고 교역로는 끊겼으며, 길 위에는 먼저 떠난 이들의 시신이 남았다. 죽은 자는 화톳불 곁에서 다시 일어나지만, 일어날 때마다 무언가를 잃는다.</p>\n<h2>곳곳의 땅</h2><p><b>노르드할</b> — 눈에 덮인 벨데인의 왕도. 장작값이 해마다 오른다.<br><b>하칸골</b> — 벨데인의 광산촌. 장작이 광석보다 귀하다.<br><b>레타시아</b> — 만년설 위 파볼릭의 성벽 도시. 첨탑의 불이 해마다 작아진다.<br><b>엘가르드 야영지</b> — 성소 곁에 천막을 친 잉그라드의 야영지.<br><b>화톳불의 제단</b> — 마지막 불이 타는 곳. 눈을 가린 파수꾼이 불을 지킨다.</p>\n<p><b>외곽(?)</b> — 마을의 불빛이 닿지 않는 땅. 처음 가 보기 전에는 무엇이 있는지 알 수 없다.</p>\n<h2>사람들</h2><p>길 위의 사람들은 저마다 숨기는 것이 있다. 부탁을 들어줄수록 마음을 열고, 마지막에는 당신의 선택을 묻는다. 어떤 행동은 누군가의 신뢰를 영영 잃게 만든다.</p>"], ["종족", null], ["기본", "<h2>시간과 행동</h2><p>마을 안에서 장소를 옮기거나 물건을 사고파는 것은 <b>즉시</b> 이루어진다. 일하기, 제작, 휴식, 이동 같은 <b>행동</b>에만 현실 시간이 걸린다. 창을 닫아도 행동은 이어지고, 다시 열면 그동안의 결과가 한꺼번에 들어온다.</p>\n<p><b>행동 창과 반복</b> — 행동 버튼을 누르면 창이 열려 필요한 재료(가진 수/필요한 수), 얻을 수 있는 것, 걸리는 시간을 보여 준다. 그 창에서 ×1~×50 또는 '계속'을 골라 시작한다. 반복은 그 행동에만 걸린다. 체력이 30% 아래로 떨어지거나 체온이 15 아래로 떨어지거나, 포만감이 5 아래로 떨어지면 스스로 멈춘다. 행동 중에는 브라우저 탭 제목에 남은 시간이 표시된다.</p>\n<h2>탈것과 길들이기</h2><p>튜토리얼 후반에 안내자가 낡은 안장을 내준다. 안장을 가진 채 순록·야생마·큰 늑대가 사는 곳에서 일하다 보면 짐승을 마주친다. <b>다가가기</b>와 <b>안장 얹기</b> 두 번을 모두 넘겨야 길들일 수 있다. 다가가다 실패하면 짐승만 달아나지만, 안장을 얹은 뒤 등에서 떨어지면 짐승이 <b>안장을 단 채</b> 달아나 안장을 잃는다. 먹이를 내밀면 다가가기 쉽고, 힘·정신·손재주가 높을수록 버티기 쉽다.</p><p>길들인 짐승은 <b>안장을 갖춰야</b> 탈 수 있다. 탈것은 한 번에 하나만 둘 수 있어서, 다른 짐승으로 갈아타거나 새로 사려면 <b>지금 탈것을 먼저 풀어 줘야</b> 한다. 풀어 준 짐승은 돌아오지 않는다. 장비 상자나 가방에서 풀어 줄 수 있다.</p><p><b>노르바스</b> — 용은 탈것 칸에 두는 짐승이 아니다. 먼 길(지도에서 멀리 떨어진 곳)을 떠날 때만 불러서 하늘길로 날아간다. 이동 시간이 크게 줄고 길 위의 습격이 닿지 않으며, 가 보지 않은 외곽으로도 곧장 갈 수 있다. 한 번 날고 나면 둥지에서 한 시간을 쉰다.</p>\n<h2>체력</h2><p>위험한 일, 전투, 동상, 굶주림으로 줄어든다. 0이 되면 쓰러진다. 눈 속에 쓰러진 당신을 누군가 가까운 마을의 불 곁까지 데려온다. 근처 사람일 수도, 데리고 다니는 동료나 탈것일 수도 있다. 사람에게 신세를 지면 작은 은혜를 갚아야 한다. 그리고 불은 사람을 다시 일으킬 때마다 <b>기억 하나</b>를 땔감으로 삼는다. 만드는 법, 누군가의 이름, 가 본 길 중 하나를 잊는다. 사람은 다시 만나면, 길은 다시 가 보면 돌아오고, 만드는 법은 다시 배우거나, 화톳불의 제단에서 불꽃 곁의 기억을 더듬거나, 밤의 정원의 꽃에서 되찾는다. <b>화톳불은 몸을 녹여 줄 뿐 상처를 낫게 하지 않는다.</b> 체력은 음식을 먹어야 돌아온다. 치유 연고는 상처에 바르는 약이다.</p><h2>쓰러지면</h2><p>깨어나도 체력은 30%만 돌아온다. 끌려오는 동안 가방의 재료 4분의 1을 흘리고(2막부터는 5분의 2, 탈것이 태워 오면 절반만), <b>깊은 상처</b>가 15분(2막부터 20분) 동안 남아 최대 체력과 공격이 12% 줄어든다. 상처가 낫기 전에 또 쓰러지면 상처가 겹친다(최대 24%).</p><h2>허기</h2><p>상태 상자의 <b>포만감</b> 막대는 허기가 찰수록 줄어든다. 일하고, 걷고, 길을 떠날수록 배가 고파진다(제작은 천천히). 가방에서 음식을 <b>먹는다</b>. 딱딱한 빵(시장)과 약초·눈뿌리·서리딸기·얼음 버섯·서리꽃은 그냥 먹을 수도 있지만 배가 별로 차지 않는다. 날고기와 날생선은 익혀야 먹을 수 있다. 솥에서 요리하면 같은 재료로 훨씬 든든해진다. 날고기는 사냥터와 토벌에서, 눈뿌리·서리딸기는 숲에서, 암염은 광맥에서 나고, 밀가루는 시장에서 산다. 포만감이 20 아래로 떨어지면 힘이 빠져 공격이 약해지고, 0이 되면 일할 때마다 체력이 깎이며 반복하던 일도 멈춘다.</p>\n<h2>한기</h2><p>상태 상자의 <b>체온</b> 막대는 한기가 쌓일수록 줄어든다. 마을 안은 불이 지켜 주지만 <b>밖에서 일하거나 이동하면 한기가 쌓인다</b>. 외곽에서는 2배, 일터 너머 깊은 곳에서는 1.5배로 쌓이고, 날씨(고요한 설원 · 눈보라 · 혹한)에 따라 더 빨라진다. 체온이 0이 되면 동상으로 체력을 잃는다.</p><p><b>횃불</b> — 마을 밖에 나가면 가방의 횃불에 불을 붙인다. 하나가 밖에서 약 30분 타고, 다 타면 다음 횃불을 쓴다. 불빛이 없으면 한기가 1.5배로 쌓인다. 푸른 재 등잔은 꺼지지 않는다. 횃불은 목재 2개로 만들거나 시장에서 산다.</p><p>화톳불 휴식(한기를 모두 걷어 냄), 외곽에서는 모닥불(목재 1), 생선 스튜·서리꽃 차·횃불, 외투와 탈것, 재능·칭호로 막는다. 처음 시작한 마을 근처에서는 튜토리얼 동안 절반만 쌓인다.</p>\n<h2>능력치와 숙련</h2><p><b>힘</b> — 체력, 받는 피해 감소, 전투 · <b>마력</b> — 주술, 전투(힘 대신) · <b>정신</b> — 체력, 주술 · <b>손재주</b> — 채집·제작 수확.</p><p><b>숙련</b>(전투·채집·제작·주술)은 해당 행동을 할수록 오르고, 수확량과 성공률을 높인다.</p>"], ["이동·탐험", "<h2>지도</h2><p>튜토리얼에서 안내자에게 낡은 지도를 받으면 화면 위쪽에 지도가 펼쳐진다. 끌어서 움직이고, 마우스 휠·두 손가락·＋/－ 버튼으로 확대하고 축소한다. 아이콘을 누르면 어디인지와 걸리는 시간이 나오고, 확인하면 실제로 이동한다.</p>\n<h2>장소의 종류</h2><p><b>마을(원)</b> — 광장·화톳불·시장·작업장이 있다. 불이 지켜 주어 한기가 쌓이지 않는다.<br><b>일터(◇)</b> — 마을 근처의 채집·사냥·낚시터. 걸어서 약 20초. 붉은 ◇는 위험한 곳이다.<br><b>깊은 곳(점선 ?)</b> — 일터에서 이어진 탐험지. 걸어서 약 45초, 한기 1.5배.<br><b>이어진 곳</b> — 외곽에서 일하다 보면 더 깊은 곳으로 이어지는 길을 찾는다. 처음 가는 곳이라도 바로 이어진 외곽에서는 갈 수 있다.<br><b>외곽(점선 원 ?)</b> — 마을에서 멀리 떨어진 미지의 땅. 처음 가면 이름이 드러나고 그곳 사람이 말을 걸어온다. 한기 2배, 화톳불이 없다.</p>\n<h2>먼 길</h2><p>마을과 외곽 사이는 수 분에서 수십 분이 걸린다. 탈것(시장에서 구입)과 안장, 재능 '눈길 걸음', 칭호로 줄일 수 있다. 도착하면 길 위의 사건이 일어나거나 적과 마주칠 수 있다.</p>\n<p><b>안내의 빛</b> — 지금 임무의 목적지는 지도에서 금빛 고리와 흐르는 점선으로 표시된다.</p>"], ["전투", "<h2>싸움의 계산</h2><p><b>공격</b> = 힘(또는 마력) + 전투 숙련 + 무기. <b>받는 피해</b>는 갑옷·외투, 힘, 재능으로 줄어든다. 상태 상자에서 현재 수치를 볼 수 있다. 한 싸움은 최대 30합이고, 결과는 승리·물러섬·쓰러짐이다.</p>\n<h2>인카운터</h2><p>위험한 일터에서 일하거나(약 12%), 먼 길 끝에 도착할 때(약 25%) 적이 나타난다. 대부분은 <b>자동으로</b> 싸우고 결과를 팝업으로 알려 준다.</p><p>가끔은 <b>선택형 전투</b> 창이 뜬다 — 맞서 싸운다 / 몰아친다(주는 피해↑ 받는 피해↑) / 방어하며 버틴다(둘 다↓) / 도망친다. <b>10초 안에 고르지 않으면 몸이 먼저 움직여</b> 무작위로 골라진다.</p>\n<h2>토벌과 우두머리</h2><p>적이 사는 장소에는 <b>토벌</b> 행동이 있다. 걸어 두면 오랫동안 그곳의 적을 사냥하며 전리품을 모은다. 한 장소에서 <b>10번 토벌</b>하면 그곳의 우두머리가 모습을 드러내고, 처음 쓰러뜨리면 고유 장비를 얻는다. 우두머리는 장비를 갖춰야 넘을 수 있다.</p>"], ["제작·장비", "<h2>모루</h2><p>마을 작업장의 <b>모루</b>에 재료 두 가지를 맞대어 두드려 볼 수 있다. 맞는 짝이면 그 장비를 만드는 법을 알게 되고, 작업장 목록에서 시간을 들여 만든다. 틀리면 재료만 상한다.</p><h2>솥</h2><p>마을 화톳불 곁의 <b>솥</b>에 아무 재료 두 가지를 넣어 볼 수 있다. 맞는 짝이면 새 요리가 나오고 만드는 법을 영영 알게 된다. 틀리면 질척한 죽이 된다. 몇몇 요리는 사람들의 부탁을 받아들일 때 배우고, 화톳불의 소문에도 힌트가 섞여 있다. 아는 요리는 솥 목록에서 시간을 들여 반복해 만든다.</p><h2>작업장</h2><p>마을의 작업장에서 아는 조합법으로 물건을 만든다. 조합법은 처음에 몇 개만 알고, <b>부탁을 받아들이거나</b>, <b>일하다가 깨치거나</b>, <b>사연 속에서</b> 배운다.</p><p>소모품은 금방 만들지만, 좋은 장비일수록 <b>재료가 많이 들고 오래 걸린다</b>(최상급은 한 시간 가까이). 켜 두고 다른 일을 하기에 좋다.</p>\n<h2>도구와 소모품</h2><p>손도끼·곡괭이·낚싯대·사냥칼은 가지고만 있어도 해당 재료를 하나 더 얻는다. 횃불은 밖에서 불을 밝혀 한기를 늦추고, 어두운 곳에 들어갈 때도 필요하다. 연고·횃불은 가방에서 '사용'하고, 음식은 '먹는다'(이름 위에 올리면 효과가 보인다).</p>\n<h2>장비 칸</h2><p><b>외투 · 갑옷 · 무기 · 탈것 · 안장</b>. 얻으면 빈 칸에 자동으로 갖추고, 가방에서 바꿀 수 있다. 안장은 탈것이 있을 때만 효과가 있다. 장비 상자 아래에 지금 받는 효과의 합계가 나온다.</p><h2>무장 단계</h2><p>갑옷과 무기의 조합법에는 단계가 있다. 지금 단계의 장비를 <b>처음 만들면</b> 다음 단계 조합법이 떠오르고, 앞 단계를 만들기 전에는 의뢰나 모루로도 다음 단계를 배울 수 없다. 단계가 오를수록 재료가 많이 든다. 작업장 목록에서 지금 단계를 볼 수 있다.</p><h2>짙어지는 위험</h2><p>하칸골 임무부터 길 위의 짐승과 망자들이 조금씩 강해지고 자주 나타난다. 2막(붉은 물의 유적 이후)에 들어서면 한층 사나워진다. 지금 무장으로 버거운 곳에는 ⚠ 표시가 붙고, 2막에서는 그런 곳에 들어가기 전에 한 번 경고한다.</p>\n<h2>시장</h2><p>마을마다 같은 물건의 값이 다르다(▲ 비싸게 팔림 · ▼ 싸게 팔림). 파는 물건도 다르다 — 노르드할의 조랑말, 야영지의 썰매개, 하칸골의 횃불 등. 기념품은 팔 수 없다.</p>"], ["임무·사연", "<h2>사건</h2><p>지금 있는 사건은 네 가지다 — 비석의 마지막 이름, 깊은 층의 열병, 늑대의 노래, 잠든 마지막 불. 사연을 들은 사람이 가끔 의뢰가 아닌 <b>사사로운 부탁</b>을 꺼낸다. 여러 마을과 외곽을 오가며 사람들에게 묻고, 깊은 곳을 뒤져 단서를 모으면 숨겨진 내막이 드러난다. 끝에서 무엇을 말하고 무엇을 감출지는 당신이 정한다. 모은 단서는 이야기 탭의 사건 기록에 남는다.</p><h2>주 임무</h2><p>처음에는 시작 마을의 <b>안내자</b>가, 나중에는 화톳불의 <b>파수꾼</b>과 각 마을 사람들이 길을 일러 준다. 임무는 제안을 <b>받아들여야</b> 시작되고, 조건을 채운 뒤 <b>그 사람에게 돌아가 보고</b>해야 끝난다. 큰 목표는 흩어진 불씨를 모아 꺼져 가는 불을 되살리는 것이고, 그 너머에도 길이 있다.</p>\n<h2>우두머리와의 싸움</h2><p>같은 사냥터에서 10번 토벌하면 우두머리가 모습을 드러낸다. 우두머리와는 <b>직접 싸운다</b>. 우두머리는 다음 행동을 미리 드러내니(공격 · 큰 일격 · 연속 공격 · 힘을 모은다), 합마다 공격 · 강타 · 방어 · 회피 · 연고 · 도망 중에서 골라 대응한다. 큰 일격은 피하고, 연속 공격은 막고, 힘을 모을 때는 강타로 몰아치는 것이 좋다. 체력이 절반 아래로 떨어지면 우두머리가 격노해 더 거칠어진다. 쓰러지면 평소처럼 짐과 기억을 잃는다. 마력이 높거나 주술을 익혔다면 <b>주술</b>로도 공격할 수 있다 — 방어를 절반 무시하지만 몸의 온기를 태운다.</p><h2>재능 갈래</h2><p>숙련마다 세 갈래가 있다. 갈래 안에서는 위에서부터 차례로 익히고, 숙련 점수는 여러 갈래에 나눠 쓴다. 전투와 주술의 갈래에는 <b>기술</b>이 있어, 익히면 우두머리전에서 따로 쓸 수 있고 일반 전투에서도 가끔 저절로 나간다. 기술은 쓰고 나면 몇 합 동안 다시 쓸 수 없다.</p><h2>연금술</h2><p>작업장의 <b>증류기</b>에서 연고, 차, 마력석과 새 약을 만든다. 만들 때마다 연금술 숙련이 오르고, 숙련이 오르면 불씨 물약(Lv.2), 상처 고약(Lv.3), 투지·쇠가죽 물약(Lv.4), 화염병(Lv.5) 만드는 법을 깨친다. 강화 물약은 15분 동안 힘을 보태고, 화염병·서리 폭약은 우두머리전에서 던진다.</p><h2>종족과 대기만성</h2><p>종족마다 타고난 힘이 있다 — 벨데인은 처음부터 싸움에 능숙해 초반에 가장 강하고, 잉그라드는 짐승의 감각으로 공격을 피하며 레벨이 오를수록 날렵해지고, 거인인 파볼릭은 받는 피해가 적고 레벨이 오를수록 가장 크게 자란다. 잉그라드의 샤멘처럼 정신이 높으면 마력이 낮아도 주술을 쓸 수 있다. 처음 몸이 약한 조합은 캐릭터를 만들 때 <b>숙련자</b>로 표시된다. 초반은 버겁지만 레벨이 오를수록 크게 성장해 끝내 타고난 전사보다 강해진다.</p><h2>현상</h2><p>우두머리마다 얽힌 사람이 있다(외눈의 하티르 — 하르겐, 어미 짐승 — 두발 등). 우두머리가 모습을 드러내면 임무 탭에 <b>현상</b>이 뜬다. 쓰러뜨리면 전리품을 얻고, 그것을 그 사람에게 가져가면 사연을 듣고 금화와 함께 <b>고유 장비 만드는 법</b>을 배운다. 고유 장비는 전리품을 재료로 모루에서 직접 만든다.</p><h2>길 안내</h2><p>지도에는 기본으로 메인 임무의 목적지까지 길이 빛난다. 임무 탭의 카드에서 <b>◎ 지도에서 길 보기</b>를 누르면 그 임무(사건·의뢰·은혜 등)의 목적지로 바뀐다. 가 보지 않은 ??? 자리라도 어느 길로 이어지는지 따라갈 수 있다. 의뢰는 재료를 다 모으기 전에는 그 재료를 구할 수 있는 가까운 곳을, 다 모으면 의뢰한 사람을 가리킨다. 다시 누르면 길 안내를 끈다.</p><h2>부탁</h2><p>마을과 외곽의 사람들에게 <b>말을 걸면</b> 부탁을 받을 수 있다. 재료를 모아 그 사람에게 가져가 건넨다. 처음 몇 번의 부탁은 <b>사연</b>으로 이어진다 — 들어줄 때마다 그 사람의 이야기가 한 장씩 열린다(사연 1/3처럼 표시된다). 사연을 다 들은 뒤의 부탁은 <b>반복</b>(단골 부탁)이다. 들어줄수록 보수가 커지고, 답례품을 얹어 주기도 한다.</p>\n<h2>사연</h2><p>부탁을 하나씩 들어줄 때마다 그 사람의 사연이 한 장씩 열린다(말을 걸기 버튼에 ✦). 마지막 장에서는 비밀이 드러나고 선택을 해야 할 때가 있다. 선택과 행동에 따라 사람들이 떠나거나, 등을 돌리거나, 새로운 장소를 알려 준다. 들은 사연은 <b>이야기</b> 탭에 기록된다.</p>"], ["성장", "<h2>동료</h2><p>길에서 작은 짐승을 만나기도 한다. 먹을 것을 나눠 주면 따라온다. 한 마리를 데리고 다니고, 나머지는 마을 화톳불 곁에서 기다린다. <b>쓰다듬고 먹이를 주면</b> 친밀도가 쌓이고, 친밀도가 높을수록(★) 솜씨가 좋아진다. 포만감이 바닥나면 돕지 않고, 오래 굶기면 친밀도가 떨어진다. 짐승마다 좋아하는 먹이가 있다.</p><h2>레벨과 재능</h2><p>숙련(전투·채집·제작·주술) 경험치가 쌓이면 그 숙련의 레벨이 오르고, 모든 숙련을 합쳐 캐릭터 레벨이 오른다.</p><p><b>숙련 재능</b> — 숙련 레벨이 오를 때마다 그 숙련의 재능 점수 1을 얻는다. 숙련마다 네 단계(Lv.2~5)가 있고, 단계마다 두 갈래 중 <b>하나만</b> 고른다. 고르지 않은 쪽은 닫힌다. 앞 단계를 익혀야 다음 단계로 넘어간다.</p><p><b>종족 재능</b> — 캐릭터 레벨이 오를 때마다 공통·종족 재능 점수 1을 얻는다. 종족마다 세 단계(캐릭터 Lv.2·4·6)가 있고, 역시 단계마다 하나를 고른다. 공통 재능은 순서 없이 익힐 수 있다. 재능은 캐릭터 화면에서 익힌다.</p>\n<h2>칭호</h2><p>특정한 일을 해내면 칭호를 얻는다. <b>얻기 전에는 조건도 효과도 숨겨져 있다.</b> 칭호는 하나만 장착할 수 있고, 현재 장착하고 있는 칭호의 효과만 적용된다. 이름 옆에 표시된다.</p>\n<h2>켜 두고 즐기기</h2><p>긴 제작이나 '계속' 반복을 걸어 두고 다른 일을 하다가 돌아오면 된다. 위험해지면 스스로 멈추고, 돌아왔을 때 팝업으로 결과를 알려 준다.</p><p class=m>오른쪽 위의 '즉시 완료(테스트)'는 시험용으로, 켜면 모든 행동과 이동이 바로 끝난다.</p>"]];

const STORY={ng:[[1,'정원지기',['“이 정원의 꽃 한 송이마다 누군가의 기억이 들어 있어요. 화톳불에서 다시 일어난 사람들이 잃어버린 것들이죠.”','“당신 것도 몇 송이 있을 거예요. 찾아보진 마세요. 찾으면 다시 아파지니까.”']],[2,'코스마의 기억',['“나도 한때는 마법사였어요. 하늘에서 불을 가져온 이들 중 하나. 우리는 불이 무엇을 먹고 타는지 알면서도 가져왔어요.”','“별의 꼭대기의 검은 원은… 우리가 불을 훔쳐 온 자리예요. 그곳이 아물지 않는 한 추위는 계속될 거예요.”']]],wd:[[1,'늑대의 노래',['이레가 늑대들 사이에서 노래한다. 가장 큰 늑대가 그녀의 무릎에 머리를 기댄다.','“부족에서 쫓겨났을 때, 얘네가 날 받아 줬어.”','“사냥이 필요하면 북쪽 얼음 초원으로 가. 순록이 많아. 여기 애들은… 건드리지 말아 줘.”']],[2,'흰 늑대의 정체',['“흰 늑대들은… 원래 우리 부족 사람들이었어. 칼셀바도르 첫해, 다들 굶어 죽어 가던 밤에 샤멘이 우리를 짐승으로 바꿨대. 살아남으라고.”','“나만 바뀌지 않았어. 그래서 쫓겨난 거야. 그래도 얘네는 아직 내 노래를 기억해.”']],[3,'붉은 갈기',['“북쪽 고개 너머에 붉은 갈기 무리가 살아. 굶으면 우리 애들을 잡아먹어. 지난겨울엔 새끼 셋을 데려갔어.”','“가죽이 필요하면 걔들을 사냥해. 그건… 아무도 너를 탓하지 않을 거야. 붉은 가죽으로 망토 짓는 법도 알려 줄게.” 그녀가 늙어 죽은 늑대들의 흰 가죽 두 장을 건넨다.']]],
po:[[1,'버려진 초소',['“여기 있던 프라우릴케들은 다 죽었다. 망자가 되어서 아직도 순찰을 돌지. 죽어서도 명령을 놓지 못하는 거다.”','세르카는 무너진 성벽 너머 레타시아 쪽을 오래 바라본다.']],[2,'왕의 명령',['“칼셀바도르가 오던 해, 왕은 우리에게 명령했다. 마력 없는 무색들을 성 밖으로 내몰라고. 장작이 모자랐거든.”','“나는 그 명령을 사흘 동안 따랐다. 나흘째 아침, 내 비늘이 바래기 시작했다. 그래서 도망쳤다.”','그녀가 소매를 걷는다. 손목의 비늘이 잿빛이다.']],[3,'추적대',['“왕의 추적대가 레타시아를 나섰다. 나를 찾는 거다. 무색이 된 프라우릴케는 살려 두지 않는다.”','“내 목엔 금화 백오십 닢이 걸려 있다. …너라면 어떻게 하겠나. 솔직하게 말해라. 원망하지 않겠다.”'],[['숨겨 준다','h'],['추적대에 넘긴다','t']]]],
pr:[[1,'순례',['마르타는 작은 보따리를 품에 꼭 안고 있다.','“제단까지 가면, 불이 아이를 다시 일으켜 준대요. 화톳불 곁에서는 죽은 이도 일어난다고요.”']],[2,'보따리 안',['보따리가 풀린다. 안에는 작은 뼈들이 가지런히 들어 있다.','“다시 일어나면 무언가를 잃는다는 거, 알아요. 그래도 괜찮아요. 아이가 잊어도, 엄마는 기억할 테니까.”']],[3,'제단까지',['“당신 덕분에 여기까지 왔어요. 이제 제단까지 하루면 돼요.”','“…파수꾼이 정말 아이를 일으켜 줄까요? 당신은 제단에 가 봤잖아요. 말해 줘요. 아이가 엄마를 기억할까요?”'],[['진실을 말한다','t'],['희망을 꺾지 않는다','h']]]],
st:[[1,'금기',['샤멘은 신탁이 아니면 입을 열지 않는다. 그런데 키야는 말을 한다.','“나는 신탁을 버렸다. 신이 대답하지 않으니까. 대답 없는 신을 위해 입을 닫고 있을 이유가 없다.”']],[2,'불이 태어난 자리',['“이 사원은 마법사들이 하늘에서 가져온 불을 처음 내려놓은 자리다. 불은 여기서 태어나 제단으로 옮겨졌다.”','“푸른 재는 불이 먹은 기억의 찌꺼기다. 이곳에 쌓인 재만큼 사람들이 자신을 잃었다. 너도 언젠가 여기 쌓이겠지.”']],[3,'봉인',['키야가 회랑 가장 안쪽 벽에 손을 댄다. 벽이 숨을 쉬듯 열린다.','“불이 태어난 방이다. 마법사들이 봉인했지. 너라면 들어가도 되겠다. 너는 이곳을 파먹지 않았으니.”','“그 안에는 아직 첫 불의 잔영이 남아 있다. 조심해라. 그것은 자기가 무엇을 했는지 모른다.”']]],
n:[[1,'비석의 이름들',['하르겐은 성문 밖 검은 비석 쪽을 오래 바라본다.','“저기 새겨진 이름들, 전부 내 부대요. 북쪽 고개에서 파볼릭 순찰대와 붙었지. 살아 돌아온 건 나 하나요.”','“벨데인은 도망친 자를 용서하지 않소. 그래서인지… 살아 돌아온 것이 가끔은 부끄럽소.”']],
[2,'새겨진 이름',['비석에 뼈를 내려놓다가 이름 하나가 눈에 걸린다. 하르겐. 맨 아래, 다른 이름들보다 새것처럼 선명하게 새겨져 있다.','“…봤소? 그 이름은 내가 새겼소. 그 고개에서 하르겐은 죽었소. 진짜 하르겐은.”','그는 더 말하지 않고 성문 안으로 들어가 버린다.']],
[3,'전령의 고백',['“내 이름은 에길이오. 하르겐의 막내 동생이지. 그날 나는 형의 방패 뒤에 숨어 있었고, 형이 쓰러지자… 달렸소. 뒤도 돌아보지 않고.”','“형의 망토를 두르고 돌아오니 다들 나를 형으로 알더군. 아무도 묻지 않았소. 나도 말하지 않았고.”','“당신이 비석 씨족에 알리면 나는 낙인이 찍히겠지. 그게 옳은 일이라는 것도 아오.”'],[['비밀을 지킨다','k'],['비석 씨족에 알린다','r']]]],
h:[[1,'열병',['“갱도에 열병이 돈다고들 하지. 열병은 무슨. …아니, 신경 쓰지 마. 쇠나 두드리자고.”','두발의 손등에 긁힌 자국이 길게 나 있다. 짐승의 발톱 자국 같다.']],
[2,'깊은 층',['“우리 아들 토린이 깊은 층에 내려간 게 칼셀바도르 첫해였어. 장작이 떨어져서, 땅속 열기라도 찾겠다고.”','“돌아오긴 했지. 돌아오긴.”','그는 연고 통을 만지작거리며 더 말하지 않는다.']],
[3,'쇠사슬',['두발이 작업장 뒤 갱도 입구로 앞장선다. 어둠 속에서 쇠사슬이 끌리는 소리가 난다. 횃불을 들자, 털이 반쯤 돋은 무언가가 웅크리고 있다. 아직 사람의 눈을 하고 있다.','“연고를 바르면 좀 조용해져. 아직 내 이름을 부르는 날도 있어. …갱도 짐승들 봤지? 다 광부였어. 토린도 곧 그렇게 될 거야.”','“나는 못 해. 당신이라면… 아니, 아무것도 아니야.”'],[['끝내 준다','k'],['못 본 척한다','l']]]],
r:[[1,'바래는 비늘',['이세르의 손목 비늘 하나가 잿빛으로 바래 있다. 시선을 느낀 그녀가 소매를 끌어내린다.','“@r_rude@”']],
[2,'마력석',['“마력석을 왜 그렇게 모으느냐고? …칼라쉬는 마력이 바닥나면 칼라쉬가 아니다. 무색이 된 파볼릭이 어떻게 되는지 알고 있나?”','“들키면 죽는다. 그러니 너는 아무것도 보지 못한 거다.”']],
[3,'검은 뱀과의 거래',['첨탑 꼭대기 방. 바닥에 그려진 진 한가운데 검은 뱀의 비늘이 놓여 있다.','“마력석만으로는 부족했다. 그래서 다른 것과 거래했지. 그것이 원하는 건… 제단의 불씨다.”','“불이 되살아나면 그것은 굶는다. 나는 다시 무색이 되고. 그러니 모른 척해라. 대가는 충분히 치르겠다.”'],[['프라우릴케에 알린다','x'],['모른 척하고 떠난다','s']]]],
g:[[1,'침묵',['오르드 곁에 천을 쓴 샤멘이 미동도 없이 앉아 있다. 숨소리가 들리지 않는다.','오르드는 당신의 시선을 막아서듯 철퇴를 고쳐 쥔다.']],
[2,'신탁',['오르드가 처음으로 먼저 입을 연다. “샤멘께서 신탁을 내리셨다. 불은 다시 탈 것이라고.”','그 말을 하는 동안, 천 아래의 샤멘은 한 번도 움직이지 않았다.']],
[3,'천 아래',['바람이 불어 샤멘의 천이 걷힌다. 그 아래에는 오래전에 말라붙은 얼굴이 있다. 재의 부족의 방식으로 일으켜 세운, 숨 쉬지 않는 몸.','“세 겨울 전에 돌아가셨다. 부족이 그걸 알면 흩어진다. 신탁이 없는 부족은 겨울을 넘기지 못한다.”','“그래서 내가 말했다. 신탁을. 내 목소리로. …카심은 샤멘을 지킨다. 나는 아직 지키고 있다. 너는 무엇을 할 텐가.”'],[['비밀을 지킨다','k'],['부족에 알린다','r']]]],
a:[[1,'꿈',['파수꾼이 고개를 기울인다. “당신, 꿈에서 나를 보았지요? 다들 그래요. 불가에 앉은 눈 가린 사람.”','“나도 꿈을 꿔요. 아주 오래된 꿈. 하늘에서 불을 들고 내려오는 꿈.”']],
[2,'되살아나는 것들',['“화톳불에서 다시 일어날 때마다 무언가를 잃는다는 말, 들어 봤어요? 사실이에요. 불은 기억을 먹고 타요.”','“이 불이 이렇게 오래 탄 건, 수많은 사람들이 여기서 다시 일어났기 때문이에요.”']],
[3,'천 아래의 것',['파수꾼이 천을 풀어 내린다. 눈이 있어야 할 자리에 아무것도 없다. 텅 빈 어둠이 불빛을 삼킨다.','“마법사들이 불을 가져왔을 때, 누군가는 그것을 지켜야 했어요. 나는 눈을 불에 바쳤죠. 그다음엔 이름을, 그다음엔 얼굴을.”','“이제 물어볼게요. 꿈에서처럼. 세상을 살리기 위해, 당신은 무엇이든 할 수 있나요?”'],[['할 수 있다','y'],['모르겠다','u']]]]};
const OUT={poh:['무색의 피난처',['세르카가 처음으로 웃는다. “고개 아래에 무색들이 숨어 사는 굴이 있다. 나는 그리로 간다. 너도 언제든 와라.”','그날 이후 초소와 고개 근처에서 금빛 문장을 단 발자국이 자주 보인다. 추적대다.'],{ul:'cs'}],pot:['현상금',['추적대가 세르카를 끌고 간다. 그녀는 끝까지 당신을 보지 않았다.','레타시아에서 현상금 백오십 닢이 도착했다. 금화에서 쇠 냄새가 난다.'],{g:150}],prt:['순례의 끝',['당신은 불이 기억을 먹고 탄다는 것을 말해 준다. 마르타는 오래 울다가, 보따리를 순례길 가에 묻는다.','“아이가 엄마를 잊는 것보다는… 이게 나아요.” 그녀가 손때 묻은 묵주를 건넨다.'],{i:{rosary:1},g:30}],prh:['제단의 아이',['마르타는 제단으로 떠났다. 며칠 뒤, 화톳불 곁에서 작은 아이 하나가 불을 쬐고 있다는 소문이 들린다.','아이는 아무도 알아보지 못한다고 한다. 마르타는 순례길로 돌아오지 않았다.'],{g:60}],nk:['망토',['“…고맙소.” 에길이 형의 망토를 벗어 건넨다. “나보다는 당신이 두르는 게 맞겠지.”','그날 이후 그는 비석 앞에서 고개를 들었다.'],{i:{cloak:1}}],
nr:['낙인',['다음 날, 에길은 성문에 다시 서 있었다. 이마에 도망자의 낙인이 찍힌 채. 그는 당신을 보지 않았다.','비석 씨족은 정의를 지킨 대가로 금화를 보냈다.'],{g:80}],
hk:['토린',['토린은 저항하지 않았다. 마지막에 아주 작게, 아버지를 불렀다.','두발은 다음 날부터 다시 쇠를 두드렸다. 전보다 조금 덜 세게. 그리고 아들의 곡괭이와 목걸이를 당신에게 쥐여 주었다.'],{i:{pick:1,locket:1}}],
hl:['쇠사슬 소리',['두발은 고개를 끄덕였다. 고맙다며 연고 두 통을 쥐여 준다.','그날 밤에도 갱도 안쪽에서 쇠사슬 소리가 들렸다.'],{i:{salve:2},g:20}],
rx:['첨탑의 밤',['왕의 정예병이 첨탑에 오른 밤, 이세르의 비명은 오래가지 않았다.','다음 날 그녀의 자리에는 벨라크라는 칼라쉬가 앉아 있었고, 이세르의 부탁도 그가 이어받았다.'],{g:100}],
rs:['입막음 값',['이세르가 아무 말 없이 보석 두 알을 내민다. 입막음 값이다.','그날 이후 그녀의 비늘은 다시 빛났다. 무엇을 대가로 했는지는 묻지 않았다.'],{i:{gem:2},g:40}],
gk:['지켜지는 거짓',['“…샤멘께서도 그러길 바라셨을 거다.” 오르드가 샤멘의 천 한 조각을 찢어 건넨다.','그날 밤에도 신탁은 내려졌다. 낮고 갈라진, 오르드의 목소리로.'],{i:{veil:1},g:40}],
gr:['흩어지는 부족',['그날 밤 야영지는 울음으로 가득 찼다. 이튿날 부족의 절반이 천막을 걷었다.','떠나는 이들이 남긴 약초 꾸러미를 오르드가 말없이 건넨다. 그는 남았다. 묻을 사람이 있으니까.'],{i:{herb:6},g:20}],
ay:['자리',['“그럼 언젠가 당신도 이 자리에 앉게 되겠죠.” 파수꾼이 다시 천을 두른다.','그 목소리가 왠지 낯익다. 아주 오래전, 당신 자신의 목소리처럼.'],{bp:1,n:['재능 점수 +1']}],
au:['정직한 대답',['“정직하군요. 불을 지킨 사람들은 다 할 수 있다고 했어요. 그리고 다 여기 앉았죠.”','파수꾼은 한참 웃다가, 아주 오래된 편지 한 장을 건넨다.'],{i:{letter:1},g:60}]};
const TK={r_low:{p:'어린 동족이여',i:'털북숭이 짐승아',b:'하찮은 인간이여'},r_rude:{p:'무례하군. 같은 핏줄이라고 봐줄 줄 아나. 볼일이 끝났으면 가라.',i:'무례하군, 짐승. 볼일이 끝났으면 가라.',b:'무례하군, 인간. 볼일이 끝났으면 가라.'},n_addr:{b:'형제여, ',p:'용족 손님, ',i:'외지인, '}};
const tx=s=>String(s).replace(/@(\w+)@/g,(m,k)=>TK[k]?TK[k][S.race]:m);
const nch=k=>{const L=STORY[k]||[],i=(S.sc||{})[k]||0;return i<L.length&&(S.qi[k]||0)>=L[i][0]?i:-1};
const nn=k=>nm(k).split(' — ')[0];
const ORG={n:['b','비석 씨족'],h:['b','하칸 광산 씨족'],r:['p','적동 번개비늘'],g:['i','재의 부족'],wd:['i','서리갈기 부족'],po:['p','성벽 여가장 가문'],pr:['b','해안 눈보라 씨족'],st:['i','키야라드의 부족']},kin=k=>!!ORG[k]&&ORG[k][0]==S.race&&ORG[k][1]==S.tr,met=k=>!!(S.met||{})[k];
const ANON={n:'성문 앞의 벨데인 사내',h:'풀무 앞의 늙은 대장장이',r:'첨탑 그늘의 파볼릭 여인',g:'불가의 거구 잉그라드',a:'눈을 천으로 가린 이',ng:'꽃 사이의 노파',wd:'늑대들 사이의 소녀',po:'잿빛 비늘의 파볼릭 여인',pr:'보따리를 안은 여인',st:'얼굴을 가린 샤멘'};
const DO={n:['@ 성문 앞에서 얼어붙은 수비대 방패의 눈을 털어 내고 있다.','@ 성문 밖 검은 비석 앞에 서서 무언가를 셈하듯 입술을 움직인다.','@ 전령 가방을 멘 채 성벽 아래를 서성이며 북쪽 고개를 올려다본다.'],h:['@ 풀무질을 하다 말고 손등으로 그을음을 훔친다.','@ 모루 위의 투박한 창날을 한참 들여다보고 있다.','@ 작업장 뒤 갱도 입구 쪽을 자꾸 돌아본다.'],r:['@ 첨탑 계단에 기대어 손끝으로 작은 번개를 튕기고 있다.','@ 성벽 위에서 오가는 이들을 내려다보고 있다.','@ 마력석 하나를 불빛에 비추어 보며 무언가를 중얼거린다.'],g:['@ 불가에 앉아 철퇴 손잡이에 가죽을 새로 감고 있다.','@ 천을 쓴 샤멘 곁을 지키듯 앉아 불씨를 뒤적인다.','@ 야영지 가장자리를 돌며 눈 위의 발자국을 살핀다.'],a:['@ 불꽃 너머에 앉아 장작 하나를 천천히 밀어 넣는다.','@ 제단의 불을 향해 고개를 숙인 채 미동도 없다.'],ng:['@ 물뿌리개를 들고 얼어붙은 꽃들 사이를 천천히 걷는다.','@ 꽃 한 송이에 귀를 대고 무언가를 듣고 있다.'],wd:['@ 흰 늑대 무리 한가운데 앉아 나지막이 노래한다.','@ 늙은 늑대의 털에 엉킨 얼음을 손으로 떼어 내고 있다.','@ 굴 입구에서 눈보라 너머를 경계하듯 바라본다.'],po:['@ 무너진 성벽에 기대어 칼날을 숫돌에 갈고 있다.','@ 초소 망루에 올라 레타시아 쪽을 오래 바라본다.','@ 불도 피우지 않은 채 갑옷 끈을 조이고 있다.'],pr:['@ 눈길 가장자리에 앉아 검게 언 발을 천으로 감싸고 있다.','@ 보따리를 꼭 끌어안고 제단 쪽으로 한 걸음씩 걷는다.','@ 길가의 작은 무덤 앞에 멈춰 서서 기도한다.'],st:['@ 물에 잠긴 회랑 끝에서 벽화를 손끝으로 더듬고 있다.','@ 무릎까지 차는 물속에서 푸른 재를 건져 올린다.']};
const INTRO={n:['사내가 방패를 털던 손을 멈춘다. 방패 가장자리에 오래된 칼자국이 촘촘하다.','“낯선 얼굴이구려. 이 성문을 드나드는 이는 다 내 눈을 거치오. 왕도의 전령이자, 성문 수비대의 마지막 고참이니.”','“하르겐이오. 북쪽 고개에서 혼자 살아 돌아온 하르겐. …다들 그렇게 부르지.”'],h:['대장장이가 풀무에서 손을 뗀다. 그을음 아래 얼굴이 몹시 지쳐 있다.','“이 화덕은 칼셀바도르가 온 뒤로 하루도 꺼진 적이 없어. 꺼지면 하칸골도 끝이니까. 아들 녀석이 하던 몫까지 내가 두드리고 있지.”','“두발이야. 하칸골 제련공. 쇠가 필요하면 나한테 오면 돼.”'],r:['여인이 손끝의 번개를 거둔다. 붉은 구릿빛 비늘이 첨탑 불빛에 번득인다.','“레타시아의 칼라쉬에게 먼저 말을 거는 자는 드물지. 용기인가, 무지인가.”','“이세르다. 기억해 두는 편이 좋을 거다. 쓸모가 있어 보이면 일거리를 주지.”'],g:['거구의 잉그라드가 고개만 든다. 무릎 위의 철퇴가 불빛을 받아 둔하게 빛난다.','곁에 천을 쓴 샤멘 하나가 미동도 없이 앉아 있다. 사내는 당신이 그쪽으로 다가가지 못하게 슬쩍 몸을 튼다.','“…카심이다. 샤멘을 지킨다. 이름은 오르드.”'],a:['불꽃 너머의 사람이 고개를 든다. 눈을 천으로 가렸는데도 당신이 선 쪽을 정확히 바라본다.','“오래 걸렸네요. 다들 결국엔 이 불 앞으로 와요.”','“나를 부를 이름은 없어요. 다들 파수꾼이라고 불러요. 이 불을 지키는 사람.”'],ng:['노파가 물뿌리개를 내려놓는다. 꽃들이 그녀를 따라 고개를 돌린다.','“어머, 산 사람이네요. 여기까지 오는 사람은 드물어요. 대개는 잃어버린 걸 찾으러 오죠.”','“코스마예요. 이 밤의 정원을 돌보고 있어요.”'],wd:['노래가 멎는다. 늑대들이 일제히 당신을 본다. 소녀가 손을 들자 으르렁거림이 가라앉는다.','“무서워하지 마. 네가 먼저 해치지만 않으면 얘네도 안 물어.”','“나는 이레. 여기서 얘네랑 살아.”'],po:['칼끝이 당신 목 앞에서 멈춘다. 여인은 한참 당신을 살피다가 칼을 거둔다.','“추적대는 아니군. 추적대라면 혼자 오지 않지.”','“세르카다. 예전엔 프라우릴케였다. 지금은… 그냥 세르카다.”'],pr:['여인이 보따리를 더 꼭 끌어안는다. 그러다 당신 얼굴을 보고는 조금 안심한 듯 웃는다.','“제단으로 가는 길이에요. 아주 오래 걸었어요. 발은… 괜찮아요. 이제 아프지도 않아요.”','“마르타예요. 순례자 마르타.”'],st:['샤멘이 돌아본다. 샤멘은 신탁이 아니면 말하지 않는다. 그런데 이 샤멘은 입을 연다.','“놀랐나. 다들 그런다. 말하는 샤멘은 처음 보겠지.”','“키야다. 이 가라앉은 사원에 홀로 남았다.”']};
const KIN={n:'“그 문양… 비석 씨족이구려. 같은 씨족끼리 염치 불고하고 부탁 하나 하겠소.”',h:'“그 손, 하칸 광산 씨족이지? 딱 보면 알아. 같은 씨족이니까 하나만 부탁하자.”',r:'“적동의 핏줄이군. 같은 비늘끼리는 서로 돕는 법이다. 부탁이 있다.”',g:'“…재의 부족이군. 같은 불을 쬔 사이다. 부탁이 있다.”',wd:'“너… 서리갈기 냄새가 나. 우리 부족이었구나. 저기, 부탁 하나만 해도 돼?”',po:'“성벽 여가장 가문의 비늘이군. 너라면 믿겠다. 부탁이 있다.”',pr:'“어머, 해안 눈보라 씨족이에요? 고향 사람이네요. 저기… 부탁 하나 해도 될까요?”',st:'“키야라드의 피다. 같은 이름을 나눈 자에게는 부탁하겠다.”'};
const GR={n:'“무슨 일이오?”',h:'“응? 뭐 필요한 거라도 있어?”',r:'“용건이 뭐지.”',g:'“…무슨 일이냐.”',a:'“왔군요.”',ng:'“어서 와요. 꽃들이 반가워해요.”',wd:'“또 왔네!”',po:'“…뭐냐.”',pr:'“아, 또 만났네요.”',st:'“무슨 일이냐.”'};
const who=k=>met(k)?nn(k):ANON[k]||nn(k),dol=k=>{const L=DO[k]||[];return L.length?L[Math.floor(Date.now()/27e5)%L.length].replace('@',jo(who(k),'이','가')):''};
const THX={ng:['고마워요. 꽃 한 송이가 다시 고개를 들었어요.','정원이 당신을 기억할 거예요.','다음에도 들러 줘요. 밤은 길어요.'],wd:['고마워! 얘네도 고마워해.','다음에도 와 줄 거지?','…넌 좋은 사람이야. 늑대들이 그렇대.'],po:['됐다. 고맙다는 말은 서툴다.','쓸 만하군. 또 부탁하지.','…너 같은 놈이 그때 곁에 있었다면.'],pr:['고마워요. 정말로요.','당신 덕분에 오늘도 걸을 수 있어요.','제단에 가면 당신 이름도 빌게요.'],st:['…고맙다. 신 대신 내가 말해 주마.','재가 너를 기억할 것이다.','다시 오라. 사원은 닫히지 않는다.'],n:['@n_addr@고맙소. 수비대가 한숨 돌리겠구려. 또 부탁할 일이 생기면 찾겠소.','이 은혜는 잊지 않겠소. 벨데인은 빚을 지고 살지 않는 법이오.','덕분에 성문이 하루 더 버티겠소. 다음에도 부탁하오.'],h:['살았다, 정말. 다음에도 부탁할게.','이걸로 며칠은 화로 안 꺼뜨리겠어. 고마워.','…고맙다. 토린도 고마워할 거야.'],r:['…쓸 만하군. 다음에도 부르겠다.','@r_low@, 이번만큼은 칭찬해 주지.','예상보다 빨랐다. 값은 치렀으니 가 봐라. 또 쓸 일이 있겠지.'],g:['…고맙다.','…샤멘께서 기뻐하실 거다. 다음에도 부탁한다.','…네 이름을 기억하겠다.'],a:['고마워요. 불이 조금 더 밝아졌어요.','당신이 와 줘서 다행이에요. 또 부탁할게요.','이 불빛 속에 당신 이름도 남겠죠. 고마워요.']};
const VO={ng:['가져왔나요?','괜찮아요. 꽃은 기다릴 줄 알아요.'],wd:['가져왔어?','아직이야? 늑대들이 기다려.'],po:['가져왔나.','아직인가. …나는 어디 안 간다.'],pr:['가져오셨어요?','괜찮아요. 천천히 기다릴게요.'],st:['가져왔는가.','아직이다. 재는 기다린다.'],n:['가져왔소?','아직이오? 기다리겠소.'],h:['가져왔어?','아직이야? 기다릴게.'],r:['가져왔나?','아직인가. 기다리지.'],g:['…가져왔나.','…기다리겠다.'],a:['가져왔어요?','아직이군요. 기다릴게요.']};
const COLDT=()=>`<p>마을 밖으로 한 발짝 나서자 바람이 살을 벤다. 숨이 하얗게 얼어붙는다.</p><p class=m>${GD[S.race]}</p><p>“마을 안은 불이 지켜 주지만, 일터부터는 다르네. 밖에서 일할 때마다 한기가 쌓이지. 한기가 끝까지 차면 동상이 번져 체력을 잃는다네.”</p><p>“하늘도 보게. 눈보라가 치면 한기가 더 빨리, 혹한이면 두 배 넘게 쌓인다네. 지금은 ${WXN[wx()]}일세.”</p><p>“횃불은 꼭 들고 다니게. 불빛 없이 걷는 자에게는 추위가 훨씬 빨리 스미지. 하나가 다 타면 가방의 다음 것에 알아서 불을 붙이게 될 걸세.”</p><p>“몸이 얼면 화톳불 곁에서 쉬게. 목재로 모닥불을 피우거나, 생선 스튜나 횃불, 모피 외투도 도움이 되지.”</p><p class=m>상태 상자의 한기 막대를 지켜보자. 이 근방에서는 아직 한기가 절반만 쌓인다.</p>`;
let MSEL=-1;
const MW=1480,MH=860,X=x=>x*200+130,Y=y=>y*150+150,ROAD=[['td','dn'],['sp','dn'],['wd','wdg'],['ip','ipf'],['st','stl'],['po','pod'],['rm','rmd'],['pr','prc'],['pr','pc'],['po','cs'],['st','sc'],['wd','rm'],['wd','ip'],['n','ip'],['r','rw'],['po','rw'],['rw','td'],['td','sp'],['td','ng'],['rw','ng'],['wd','sp'],['n','a'],['n','h'],['a','r'],['a','g'],['h','g'],['h','a'],['n','wd'],['r','wd'],['r','po'],['a','pr'],['r','pr'],['g','st'],['h','st']],WO={n:[[-95,10],[95,10],[0,-72]],h:[[-10,-85],[95,-45],[90,50]],r:[[0,-85],[-100,-30],[90,40]],a:[[-100,-10],[100,-10],[0,-80]],g:[[-100,-10],[100,-10],[0,-80]]},pnm=k=>PL[k].w&&!(S.vis||{})[k]?'???':PL[k].n,PK=()=>Object.keys(PL);
const wdesc=(k,i)=>(WD[k]||[])[i]||'';
const known=k=>k==S.home||!!(S.vis||{})[k],lost=k=>PL[S.loc].w&&!known(k)&&PAR[k]!==S.loc;
const PAR={pc:'pr',cs:'po',sc:'st',rm:'wd',ip:'wd',wdg:'wd',ipf:'ip',stl:'st',pod:'po',rmd:'rm',prc:'pr'},KID={wd:'wdg',ip:'ipf',st:'stl',po:'pod',rm:'rmd',pr:'prc'},KIDT={wdg:'굴 가장 안쪽, 늑대들이 고개를 숙이고 지나가는 좁은 틈이 있다. 그 너머에서 찬 바람이 분다.',ipf:'순록 떼가 눈보라를 피해 한 방향으로 사라진다. 그 끝에 하얗게 언 숲이 보인다.',stl:'회랑 벽 한쪽이 물에 잠긴 계단으로 이어진다. 계단 아래로 젖은 책장이 보인다.',pod:'무기고 바닥의 쇠문 틈으로 쇠사슬 소리가 들린다. 아래로 내려가는 계단이 있다.',rmd:'붉은 갈기들이 드나드는 굴 뒤편으로 푸르게 빛나는 얼음 동굴이 이어진다.',prc:'눈보라가 걷힌 사이, 순례길 옆 언덕 위로 종탑 하나가 보인다.'};
let MP={x:0,y:0,k:'',s:1},MD=null,MPM=0,PT=new Map(),PZ=null;

const WD={hv:['바위틈에서 김이 오를 때마다 검은 벌들이 웅웅거린다. 연기를 피워 벌을 달래고 벌집 한 귀퉁이만 떼어 낸다. 욕심을 부리면 쏘인다.','따뜻한 물이 흐르는 둔치에는 눈 대신 풀이 자란다. 하칸골 아낙들이 약초를 캐러 몰래 오는 곳이다.'],dn:['얼음 동굴이 봉우리 안쪽으로 끝없이 이어진다. 깊이 들어갈수록 얼음이 따뜻해진다.','둥지 가장자리에 방패만 한 비늘 조각과 거대한 뼈가 흩어져 있다.'],wdg:['늙은 흰 늑대들의 뼈가 둥글게 누워 있다. 뼈 사이에서 잉그라드의 뼈 장신구가 나온다. 이 늑대들은 한때 무엇이었을까.','바위틈에서 솟은 물이 얼어 기둥이 되었다. 늑대들은 마지막에 이 물을 마신다.'],ipf:['언 가지에 서리딸기가 매달려 있다. 순록이 먹다 남긴 눈뿌리도 보인다.','순록이 뿔을 갈던 나무 밑동에 떨어진 뿔이 쌓여 있다. 순록 떼가 가까이 있다.'],stl:['얼음물 위로 떠오른 책장에 마법사들의 글씨가 번져 있다. 어둡다. 불빛이 필요하다.','물 밑 바닥에 박힌 보석들이 횃불빛에 깜빡인다.'],pod:['감방마다 녹슨 쇠사슬과 버려진 소지품이 있다. 어둡다. 불빛이 필요하다.','간수들이 쓰던 무기 선반. 아직 순찰을 도는 망자 간수가 있다.'],rmd:['푸른 얼음벽을 깨면 안쪽에 보석과 암염이 박혀 있다. 붉은 갈기들이 이곳을 지나 사냥을 나간다.','동굴 깊은 곳 습기 찬 바위에 얼음 버섯이 핀다.'],prc:['무너진 제단 위에 순례자들이 남긴 공물이 얼어붙어 있다. 일어난 순례자가 아직 이곳을 지킨다.','종탑 안 얼음을 깨면 순례자들이 남긴 빵이 얼어 있기도 하다.'],pc:['보따리마다 이름표가 달려 있다. 대부분 아이 이름이다. 산 사람이 버린 것이라 가져가도 탈이 없다.'],cs:['바위틈에서 하얀 버섯이 자란다. 피난민들은 이것으로 겨울을 난다.','추적대가 오면 가장 먼저 이 입구를 지나야 한다. 누군가는 지켜야 한다.'],sc:['바닥의 재는 아직 따뜻하다. 긁을 때마다 누군가의 목소리가 아주 작게 들린다.'],ip:['순록 떼를 바람 반대쪽에서 쫓는다. 흰 늑대를 건드리지 않고도 가죽과 뿔을 얻을 수 있는 곳이다.','눈을 헤치면 얼음 밑에서 푸른 이끼가 나온다. 순록이 먹고 남긴 자리다.'],rm:['붉은 갈기 늑대들은 흰 늑대보다 작지만 더 사납다. 굶주리면 같은 늑대도 잡아먹는다.','굴 입구에는 무리가 끌고 온 것들이 쌓여 있다. 작은 흰 뼈가 유난히 많다.'],rw:['붉은 물은 손을 담가도 차갑지 않다. 병에 담으면 안에서 무언가가 천천히 맴돈다.','물에 잠긴 회랑에는 썩지 않은 이들이 서 있다. 지나가면 고개를 돌린다.'],td:['바닥에 남은 푸른 고름 자국을 따라간다. 사냥개는 모서리에서 나온다. 둥근 곳에 서 있으면 안전하다고들 한다.','각진 바위 틈마다 푸른 고름이 맺혀 있다. 오래 들여다보면 틈이 이쪽을 들여다본다.'],ng:['꽃잎을 만지면 낯선 기억이 스친다. 누군가의 첫 겨울, 누군가의 마지막 불.'],sp:['검은 원 아래로 그림자들이 쏟아져 내린다. 하나하나가 불에 기억을 바친 이들의 남은 형체다.'],wd:['흰 늑대들은 사람을 피하지만, 굶주리면 다르다. 가죽은 귀하고, 사냥꾼의 뼈는 굴 입구에 흔하다.','굴 안쪽에는 늑대들이 물어 온 것들이 쌓여 있다. 짐승 뼈 사이로 사람의 반지가 빛난다.'],po:['무너진 무기고. 녹슨 창들 사이에 검은 비늘 조각이 떨어져 있다. 누구의 것인지는 생각하지 않는 편이 좋다.','망자가 된 프라우릴케들이 정해진 길을 돈다. 그들의 갑옷에서 떨어지는 비늘은 아직 마력을 머금고 있다.'],pr:['길가 눈 밑으로 푸르스름한 꽃이 핀다. 순례자들이 쓰러진 자리마다 더 많이 핀다는 말이 있다.','이름 없는 무덤들. 돌 하나씩만 얹혀 있고, 어떤 무덤은 안에서 긁는 소리가 난다.'],st:['물에 잠긴 회랑은 빛이 전혀 들지 않는다. 바닥에 쌓인 푸른 재가 발목까지 차오른다. 횃불이 필요하다.','사원 마당의 연못. 얼음 밑에서 눈 없는 물고기들이 천천히 맴돈다.'],n:['성벽 밖 침엽수림. 얼어붙은 나무는 도끼날을 튕겨 내고, 쓰러진 나무 밑에는 가끔 먼저 온 나무꾼이 묻혀 있다.','끝없이 하얀 설원. 굶주린 늑대 떼가 눈보라를 등지고 다닌다. 발자국을 놓치면 사냥꾼이 사냥감이 된다.','두꺼운 얼음에 구멍을 내고 기다린다. 얼음 아래로 커다란 그림자가 지나가는 날도 있다.'],
h:['버려진 갱도의 첫 층. 곡괭이 소리가 길게 울리고, 무너진 버팀목 사이로 찬바람이 샌다.','빛이 닿지 않는 깊은 갱도. 굴을 판 짐승들이 이제는 광부의 뼈를 갉는다. 횃불 없이는 들어갈 수 없다.','갱도 아래로 흐르는 검은 물. 눈 없는 물고기가 잡히고, 물은 이상하게 미지근하다.'],

const o=Object.keys(S.pets).filter(k=>k!=S.pa);if(o.length)h+=o.map(k=>`<div class='row ptw'>${pav(k,1)}<span class=ptn><span>${PET[k].n}</span><span class=m style='font-size:12px' title='화톳불 곁에서 기다린다'>화톳불 곁 대기</span></span>${vil&&!S.act?`<button onclick="pswap('${k}')">데려간다</button>`:''}</div>`).join('');

const CASE={
stone:{t:'비석의 마지막 이름',d:'하르겐의 사사로운 부탁',start:s=>((s.sc||{}).n||0)>=1,s:[
 {at:()=>'n',L:()=>['하르겐이 성문 밖 비석 쪽을 보다가 당신을 부른다.','“부탁이 하나 있소. 의뢰가 아니라… 내 사사로운 부탁이오.”','“북쪽 고개 아래 옛 전장에 내 부대가 아직 대열을 지키고 서 있소. 얼어붙은 채로. 맨 앞줄 어딘가에 비석 문양이 새겨진 방패가 있을 거요. 우리 대장의 방패요.”','“그걸 찾아다 주시오. 비석 앞에 세워 두고 싶소. …내가 직접 가야 마땅하지만, 그 고개를 다시 볼 자신이 없소.”'],c:'하르겐은 옛 전장에 남은 대장의 방패를 찾아 달라고 했다. 직접은 가지 못하겠다고 했다.',h:'노르드할 근처 얼어붙은 옛 전장(일터 너머 깊은 곳)을 수색한다'},
 {at:()=>'n3',f:1,give:{oshield:1},L:()=>['얼어붙은 병사들 사이, 맨 앞줄. 눈 속에 방패 하나가 비스듬히 박혀 있다. 비석 문양이 새겨져 있다.','방패 겉면은 번개를 맞은 듯 검게 터져 있다. 파볼릭의 마법이다.','방패 안쪽, 손잡이 아래에 작은 비늘 하나가 끼어 있다. 잿빛이다. 색이 없는 파볼릭의 비늘.','방패 바로 뒤 눈이 둥글게 패어 있다. 누군가 웅크려 숨어 있던 자리처럼. 아주 작은 누군가.'],c:'방패 안쪽에 색 없는 파볼릭의 비늘이 끼어 있었다. 방패 뒤에 아이만 한 누군가가 숨어 있던 흔적이 있다.',h:'방패를 노르드할의 하르겐에게 가져간다'},
 {at:()=>'n',L:()=>['하르겐이 방패를 받아 들고 한참 말이 없다. 그을린 자국을 손끝으로 더듬는다.','“…형의 방패요.” 그가 입을 다문다. 그리고 다시 연다. “아니, 대장의 방패라 했지. 잊으시오.”','잿빛 비늘을 보여 주자 그의 얼굴이 굳는다.','“파볼릭 순찰대가 우릴 덮쳤소. 그건 아오. 하지만 왜 형의 방패 뒤에 파볼릭 아이가…? 그날 나는… 뒤를 돌아볼 겨를이 없었소.”','“색 없는 비늘이라. 그런 비늘을 아는 자라면 알지도 모르겠소. 방패는 가져가시오. 보여 줄 데가 있다면.”'],c:'하르겐은 방패를 보고 \'형의 방패\'라 했다가 말을 거두었다. 그날의 일을 다 알지는 못하는 듯하다.',h:s=>s.so&&s.so.po=='t'?'색 없는 비늘을 아는 이 — 레타시아 첨탑 감옥에 갇힌 세르카를 찾는다':'색 없는 비늘을 아는 이 — 무너진 파볼릭 초소의 세르카를 찾는다'},
 {at:s=>s.so&&s.so.po=='t'?'r':'po',L:s=>(s.so&&s.so.po=='t'?['첨탑 아래 감옥. 쇠창살 너머에 세르카가 앉아 있다. 추적대에 넘겨진 뒤로 비늘이 거의 다 잿빛이 되었다.','당신이 방패를 창살 사이로 보여 주자, 그녀가 천천히 고개를 든다.']:['세르카가 방패를 보자마자 칼에서 손을 뗀다. 처음 보는 표정이다.','“…이걸 어디서 났나.”']).concat(['“왕의 명령 사흘째였다. 무색들이 북쪽 고개로 달아났고, 우리는 쫓았다. 고개 아래에서 벨데인 부대가 길을 막았지. 맨 앞에 이 방패를 든 사내가 있었다.”','“그가 외쳤다. 이들은 우리 불가에 앉을 손님이다, 라고. 그 뒤에 무색 아이 하나가 숨어 있었다.”','“나는 명령대로 했다. 번개로.” 그녀가 손목의 잿빛 비늘을 내려다본다. “다음 날 아침부터 내 비늘이 바래기 시작했다.”','“아이는 살았다. 쓰러진 사내 뒤에서 기어 나와 동쪽으로 달렸지. 잿불 냄새가 나는 쪽으로. …잉그라드 야영지 쪽이다.”']),c:'하르겐의 형을 쓰러뜨린 것은 세르카였다. 그가 지킨 무색의 아이는 살아서 잉그라드 야영지 쪽으로 달아났다.',h:'엘가르드 야영지 화톳불 곁의 오르드에게 무색의 아이를 묻는다'},
 {at:()=>'g',L:()=>['오르드가 방패 문양을 보고 천천히 일어선다. 그리고 말없이 천막 하나를 걷는다.','안에 잿빛 비늘의 파볼릭 아이가 앉아, 뼈 조각에 무언가를 새기고 있다. 잉그라드의 털옷을 입었다.','“…닐이다. 그 겨울, 피투성이로 우리 불가에 기어 왔다. 샤멘께서… 받아들이라 하셨다.”','아이가 방패를 보더니 벌떡 일어나 문양을 손바닥으로 덮는다.','“아저씨 방패야. 아저씨가 나를 뒤에 숨기고, 옆에 있던 형한테 소리쳤어.”','“에길, 뛰어. 뒤돌아보지 마. …그래서 그 형은 뛰었어. 아저씨가 시켜서.”'],c:'야영지의 무색 아이 닐이 기억하고 있었다. 방패의 사내는 마지막에 \'에길, 뛰어. 뒤돌아보지 마.\'라고 외쳤다.',h:'노르드할로 돌아가 하르겐에게 모든 것을 전한다'},
 {at:()=>'n',take:['oshield'],L:()=>['하르겐에게 닐의 말을 전한다. 에길, 뛰어. 뒤돌아보지 마.','그가 방패를 떨어뜨린다. 방패가 눈 위에 쓰러지는 소리가 길게 울린다.','“…형이 그렇게 말했소? 나한테?”','“나는 도망친 줄 알았소. 십 년을 그렇게 알았소. 형의 이름을 빌려 쓰면서.”','그가 당신을 본다. “형을 쓰러뜨린 자가 누군지도 알아냈겠지. …말해 주겠소?”'],ch:()=>[['세르카의 일까지 모두 말한다','t'],['형이 지킨 아이 이야기만 한다','h']]}],
o:{t:['모든 진실','<p>세르카의 이름을 듣고, 하르겐은 오래 비석을 본다.</p><p>“…그 프라우릴케도 그날 무언가를 잃었구려. 비늘이 바랬다 했소?”</p><p>“형은 그 아이를 지켰소. 나는 형이 지킨 것을 지키겠소. 복수는… 형이 바라던 게 아니오.”</p><p>그는 비석 맨 아래의 이름을 칼끝으로 긁어낸다. 그리고 새로 새긴다. <b>하르겐 — 손님을 지킨 자</b>. 그 아래에 작게, <b>에길</b>.</p><p>“형의 방패는 형의 이름을 찾아 준 사람이 가져가시오.”</p>',{i:{hshield:1}}],
 h:['지켜진 아이','<p>세르카의 이름은 말하지 않는다. 하르겐도 묻지 않는다.</p><p>“…그 아이가 살았다니. 형이 헛되이 쓰러진 게 아니었구려.”</p><p>그는 비석의 이름 옆에 작게 새긴다. <b>손님을 지킨 자</b>.</p><p>“형의 방패는 당신이 가져가시오. 나는 이제 형의 이름 뒤에 숨지 않아도 될 것 같소.”</p>',{i:{hshield:1},g:60}]}},

 {at:()=>'wd',L:()=>['이레가 늑대들 사이에서 노래를 멈추고 당신을 부른다.','“얘네가 원래 사람이었다는 거, 말했지. 근데 이상해. 그날 밤 샤멘이 뭐라고 했는지 아무도 기억을 못 해. 얘네도, 나도.”','“늙은 애들은 죽을 때가 되면 굴 제일 안쪽으로 가. 다들 거기 묻혀. …거기 가면 뭔가 남아 있을지도 몰라. 난 무서워서 못 가.”'],c:'이레의 부족이 늑대가 된 밤, 샤멘이 무슨 말을 했는지 아무도 기억하지 못한다.',h:s=>(s.ul||{}).wdg?'하얀 늑대의 굴 안쪽, 늑대들의 무덤을 수색한다':'하얀 늑대의 굴 안쪽을 뒤지며 늑대들의 무덤으로 가는 길을 찾는다'},
 {at:()=>'wdg0',f:1,give:{spflute:1},L:()=>['늙은 늑대들의 뼈가 둥글게 누운 자리 한가운데, 돌 위에 무언가가 놓여 있다.','뼈로 깎은 피리다. 구멍마다 재로 그은 문양이 남아 있다. 재의 부족 샤멘의 문양이다.','피리 곁에 샤멘이 얼굴을 가릴 때 쓰는 천 조각이 얼어붙어 있다. 늑대들이 그 천을 둘러싸고 누워 있었던 것처럼 뼈가 놓여 있다.'],c:'늑대들의 무덤에서 재의 부족 샤멘의 뼈 피리와 천 조각을 찾았다. 서리갈기 부족을 바꾼 샤멘은 재의 부족 사람이었다.',h:'엘가르드 야영지의 오르드에게 피리를 보인다'},
 {at:()=>'g',L:()=>['오르드가 피리를 보는 순간, 철퇴를 쥔 손에 힘이 들어간다.','“…우리 샤멘의 피리다.”','“그 겨울, 샤멘께서 홀로 북쪽으로 떠나셨다. 굶어 죽어 가는 이웃 부족이 있다고. 돌아오셨을 때는 피리가 없었고, 사흘 뒤 숨을 거두셨다.”','“마지막에 하신 말씀은 하나였다. 노래를 남기고 왔다, 열쇠도 남기고 왔다.”','그가 오래 침묵한다. “나는 그 뜻을 몰랐다. 신탁은 나에게 오지 않으니까.”'],c:'오르드의 샤멘은 서리갈기 부족을 살리러 갔다가 돌아와 숨을 거두었다. 마지막 말은 "노래를 남기고 왔다, 열쇠도 남기고 왔다."',h:s=>s.ho&&s.ho.st?'샤멘의 의식을 아는 이 — 화톳불의 제단의 파수꾼에게 묻는다':'샤멘의 의식을 아는 이 — 가라앉은 사원의 키야에게 묻는다'},
 {at:s=>s.ho&&s.ho.st?'a':'st',L:s=>(s.ho&&s.ho.st?['파수꾼이 피리를 손끝으로 쓸어 본다.','“이런 의식은 저도 본 적이 있어요. 아주 오래전에.”']:['키야가 피리를 받아 들고 구멍 하나하나에 손끝을 댄다.','“금기 중의 금기다. 굶주린 부족을 짐승으로 바꿔 겨울을 넘기게 하는 의식.”']).concat(['“그런 의식은 반드시 열쇠를 남긴다. 바뀌지 않은 한 사람. 그 사람이 그 밤의 노래를 이 피리로 불면, 짐승들은 사람으로 돌아온다.”','“그 아이가 혼자 바뀌지 않은 건 저주가 아니었다. 샤멘이 일부러 남긴 거다.”','“하지만 알아 둬라. 사람으로 돌아오면 굶주림도 돌아온다. 그들의 겨울은 아직 끝나지 않았다.”']),c:'이레가 혼자 늑대가 되지 않은 건 샤멘이 남긴 열쇠였다. 이레가 피리로 그 밤의 노래를 부르면 늑대들은 사람으로 돌아온다. 굶주림과 함께.',h:'하얀 늑대의 굴로 돌아가 이레에게 모든 것을 전한다'},
 {at:()=>'wd',take:['spflute'],L:()=>['이레에게 피리와 샤멘의 말을 전한다.','이레는 한참 동안 피리를 쥐고 서 있다. 가장 큰 늑대가 그녀의 손등을 핥는다.','“…내가 열쇠였어? 쫓겨난 게 아니라?”','“얘네가 사람이 되면… 엄마도, 오빠도 돌아오는 거야. 근데 다시 배고파지겠지. 그 겨울처럼.”','그녀가 당신을 본다. “너라면 어떻게 할래?”'],ch:()=>[['노래를 불러 보라고 한다','a'],['지금 이대로 두자고 한다','b']]}],
o:{a:['돌아온 부족','<p>이레가 피리를 입에 댄다. 처음엔 떨리던 소리가 이내 굴을 가득 채운다. 늑대들이 하나씩 고개를 든다.</p><p>털이 눈처럼 흩어진다. 그 자리에 깡마른 사람들이 서 있다. 서리갈기 부족이다. 누군가 이레의 이름을 부른다.</p><p>그날 밤 그들은 엘가르드 야영지로 걸어갔다. 오르드가 말없이 불가의 자리를 내주었다.</p><p>이레가 돌아보며 외친다. “고마워! …다들 배고프대. 그래도, 다들 말을 해!”</p>',{g:120}],
 b:['늑대의 겨울','<p>이레가 피리를 품에 넣는다.</p><p>“얘네는 지금 안 배고파. 춥지도 않고. 노래도 들어. …사람으로 돌아오는 건 봄이 오면 할래.”</p><p>그녀가 가장 큰 늑대의 목을 끌어안는다. 늑대들이 당신 곁으로 와서 차례로 코를 비빈다. 무리가 당신을 받아들였다.</p>',{i:{pelt:3}}]}},

 {at:()=>'r3',f:1,give:{rubbing:1},L:()=>['두개골 안쪽 벽, 누군가 마력으로 새긴 글귀가 맥박처럼 밝아졌다 어두워진다.','숯과 얼음으로 탁본을 뜬다. 종이 위로 옮겨진 글자들이 아직 따뜻하다.','읽을 수는 없다. 다만 글귀 끝에 그려진 그림 하나는 알아볼 수 있다. 얼음 봉우리, 그리고 그 아래 웅크린 무언가.'],c:'두개골 속 글귀를 탁본으로 떴다. 끝에 얼음 봉우리 아래 웅크린 무언가가 그려져 있다.',h:'탁본을 레타시아의 칼라쉬에게 가져간다'},
 {at:()=>'r',take:['rubbing'],ul:'dn',L:s=>[s.so&&s.so.r=='x'?'벨라크가 탁본을 펼치고 한참 읽는다.':'이세르가 탁본을 받아 들고, 처음으로 손이 떨린다.','“용의 말이다. …북동쪽 끝, 지도에 없는 얼음 봉우리. 마지막 불이 거기 잠들어 있다고 한다.”','“그리고 이렇게 끝난다. 불을 든 자만 깨울 수 있다.”','“우리가 가진 불로는 안 된다. 칼라쉬의 번개는 불이 아니니까. 진짜 불이 있는 곳은 하나뿐이지.”'],c:'글귀는 북동쪽 끝 얼음 봉우리에 마지막 용이 잠들어 있다고 했다. 불을 든 자만 깨울 수 있다.',h:'화톳불의 제단의 파수꾼에게 불을 청한다'},
 {at:()=>'a',give:{altflame:1},L:()=>['파수꾼이 탁본 이야기를 듣고, 오래 불꽃을 바라본다.','“용… 아직 남아 있었군요. 우리가 하늘에서 불을 가져오기 전부터, 이 땅을 데우던 건 용의 불이었어요.”','파수꾼이 제단의 불에서 작은 불꽃 하나를 떼어 등잔에 담아 건넨다. 불꽃이 바람도 없는데 북동쪽으로 기운다.','“가져가요. 이 불이 길을 알 거예요. 그리고… 깨우게 될지, 재우게 될지는 당신이 정해요.”'],c:'파수꾼이 제단의 불꽃을 등잔에 담아 주었다. 불꽃이 북동쪽으로 기운다.',h:'지도 북동쪽 끝, 얼어붙은 용의 둥지로 가서 둥지 깊은 곳을 살핀다'},
 {at:()=>'dn0',f:1,take:['altflame'],L:()=>['얼음 동굴 가장 깊은 곳. 등잔의 불꽃이 갑자기 커진다.','얼음 속에 산처럼 큰 그림자가 웅크려 있다. 비늘 하나가 방패만 하다. 숨결 한 번에 동굴 전체의 서리가 흩날린다.','눈꺼풀이 천천히 열린다. 그 안에서 꺼져 가는 숯불 같은 눈동자가 당신을 본다. 목소리가 머릿속에 직접 울린다.','“…작은 것. 불을 들고 왔구나. 내 이름은 노르바스. 너희가 하늘의 불을 가져오기 전, 마지막으로 남은 땅의 불이다.”','“그 불꽃을 내게 주면 나는 깨어난다. 다시 날 수 있겠지. 대신 내가 깨어 있는 동안, 이 땅의 추위는 나를 노릴 것이다.”','“주지 않으면 나는 다시 잔다. 잠든 채로 이 봉우리를 데우며, 언젠가 꺼지겠지.”'],ch:()=>[['불꽃을 건넨다','w'],['다시 잠들게 둔다','z']]}],
o:{w:['깨어난 용','<p>불꽃이 노르바스의 입 안으로 사라진다. 동굴의 얼음이 한꺼번에 녹아 쏟아진다.</p><p>거대한 날개가 펼쳐지고, 숯불 같던 눈이 금빛으로 타오른다.</p><p>“고맙다, 작은 것. 빚은 갚는다. 먼 길을 가야 할 때 나를 불러라. 하늘은 눈보라보다 빠르다.”</p><p class=m>✦ 먼 길을 떠날 때 노르바스를 부를 수 있다. 하늘길은 짧고 습격이 닿지 않지만, 한 번 날고 나면 둥지에서 한 시간을 쉰다. 가까운 길에는 오지 않는다.</p>',{i:{dragon:1}}],
 z:['잠든 마지막 불','<p>등잔을 거둔다. 노르바스의 눈이 천천히 감긴다.</p><p>“…현명한지도 모르겠구나. 깨어난 불은 언제나 무언가를 먹는다.”</p><p>그가 몸을 뒤척이자 비늘 몇 장이 얼음 위로 떨어진다. 아직 따뜻하다.</p><p>“가져가라. 추위가 너를 덜 미워하게 될 것이다.”</p>',{i:{dscalemail:1}}]}},

 {at:()=>'h',give:{claw:1},L:()=>['두발이 화덕 불을 줄이고 작업장 문을 닫는다.','“당신한테만 말할게. 토린이 요즘 이상한 걸 토해. 푸르스름한 재 같은 거.”','그가 헝겊에 싼 것을 내민다. 짐승 발톱 하나. 발톱 틈에 푸른 가루가 엉겨 있다.','“열병이 이런 걸 만들 리 없어. 갱도 깊은 데서 뭔가 일어나고 있는 거야. 근데 난 토린 곁을 못 떠나. …이게 뭔지 알아봐 줄 수 있어?”'],c:'토린의 발톱에 푸른 가루가 엉겨 있었다. 두발은 열병 때문이 아니라고 믿는다.',h:s=>s.ho&&s.ho.st?'푸른 재를 아는 이 — 화톳불의 제단의 파수꾼에게 묻는다':'푸른 재를 아는 이 — 가라앉은 사원의 키야에게 묻는다'},
 {at:s=>s.ho&&s.ho.st?'a':'st',L:s=>s.ho&&s.ho.st?['파수꾼이 발톱의 냄새를 맡듯 고개를 기울인다.','“푸른 재… 불이 먹은 기억이에요. 이 제단의 불도 그걸 먹고 타요.”','“하지만 이건 이 불이 아니에요. 땅속 어딘가에서 다른 불이 사람을 먹고 있어요. 그런 불은 검은 뱀만 피울 수 있죠. 그리고 뱀에겐 늘 거래 상대가 있어요.”','“검은 물이 끝나는 곳. 하칸골 갱도 끝을 찾아보세요.”']:['키야가 발톱을 물에 헹구더니, 손끝에 묻은 가루를 오래 들여다본다.','“푸른 재다. 불이 기억을 먹고 남긴 찌꺼기. 이 사원 바닥에 쌓인 것과 같다.”','“그런데 이게 왜 광부의 발톱에 있지. …누군가 땅속에서 산 사람의 온기와 기억을 땔감으로 태우고 있다는 뜻이다.”','“그런 불을 피울 수 있는 건 검은 뱀뿐이다. 그리고 뱀은 혼자 불을 피우지 않는다. 거래한 자가 있다.”','“갱도 가장 깊은 곳, 검은 물이 끝나는 데를 뒤져 봐라. 땔감을 나른 흔적이 있을 거다.”'],c:'토린의 발톱에 묻은 것은 푸른 재였다. 땅속에서 누군가 검은 뱀과 거래해 광부들의 온기를 태우고 있다.',h:'하칸골 지하 수로 너머 검은 물의 끝(일터 너머 깊은 곳)을 수색한다'},
 {at:()=>'h3',f:1,give:{ledger:1},L:()=>['검은 물이 끝나는 곳. 지하 호숫가에 버려진 수레들이 줄지어 서 있다.','수레마다 푸르스름한 돌이 조금씩 남아 있다. 손을 대니 온기가 빨려 나가는 느낌이 든다.','호숫가 바위틈에서 기름 먹인 가죽 장부 하나를 찾았다. 광부 감독의 것이다.','“불씨돌 열두 수레. 받는 곳 — 레타시아 첨탑. 값은 마력석으로.” 장부 맨 끝에 붉은 인장이 찍혀 있다. 번개 문양. 칼라쉬의 인장이다.'],c:'갱도 끝에서 불씨돌을 나른 장부를 찾았다. 받는 곳은 레타시아 첨탑, 칼라쉬의 번개 인장이 찍혀 있다.',h:'장부를 들고 레타시아 첨탑의 칼라쉬를 찾아간다'},
 {at:()=>'r',take:['ledger'],L:s=>s.so&&s.so.r=='x'?['칼라쉬 벨라크가 장부를 훑어보고 코웃음을 친다.','“이세르의 인장이군. 그 여자는 이미 프라우릴케에게 끌려갔다. 방을 치우다가 이걸 찾았지.”','그녀가 검은 비늘 하나를 던져 준다. 뱀과 맺은 계약의 증표다.','“증표가 남아 있는 한 거래는 계속된다. 뱀은 주인이 바뀌어도 상관하지 않거든. 태울 곳이 있다면 가져가라. 나는 그런 것에 손대지 않는다.”']:['이세르가 장부의 인장을 보는 순간, 손끝의 번개가 꺼진다.','“…광부 감독이 이걸 남겼다고? 멍청한 것.”','“그래, 내가 샀다. 불씨돌은 땅속 온기를 머금은 돌이다. 그걸 뱀에게 바치면 뱀이 내 마력을 채워 준다. 바래 가는 비늘을 멈춰 준다.”','“광부들이 짐승이 되는 건… 돌을 캐는 동안 뱀이 그들의 온기까지 핥아먹기 때문이겠지. 나는 묻지 않았다.”','그녀가 품에서 검은 비늘 하나를 꺼내 탁자에 놓는다. 뱀과 맺은 계약의 증표다.','“이걸 없애면 거래는 끝난다. 광부들은 더 바뀌지 않겠지. 그리고 나는 무색이 된다.” 그녀가 금화 주머니를 그 옆에 놓는다. “아니면 이걸 가져가고, 장부는 잊어라.”'],h:'검은 뱀의 비늘을 화톳불의 제단의 파수꾼에게 가져간다',ch:s=>s.so&&s.so.r=='x'?[['비늘을 받아 든다','b']]:[['비늘을 받아 든다 — 거래를 끊는다','b'],['금화를 받는다 — 장부를 잊는다','g']]},

'양피지 귀퉁이에 서툰 글씨로 한 줄이 덧붙어 있다. “나는 세 가지를 다 바쳤다. 그런데 왜 아직도 그 사람의 목소리가 기억나는가.”']},
f4:{s:'fire',t:'첫 재의 기록',a:'불이 태어난 방, 그을음 밑에 눌어붙은 석판',at:['sc0'],x:[
'우리는 불을 이 방 바닥에 내려놓았다. 불은 처음 사흘 동안 아무것도 태우지 않고 그저 떠 있었다. 장작을 넣어도 먹지 않았고, 기름을 부어도 먹지 않았다.',
'나흘째 되는 날, 우리 중 가장 어린 이가 고향의 겨울 이야기를 하며 손을 내밀었다. 불은 그제야 처음으로 타올랐다. 그는 그날 밤 자기 어머니의 얼굴을 기억하지 못했다.',
'그때 알았다. 이 불은 나무가 아니라 기억으로 탄다. 우리는 그 사실을 사람들에게 말하지 않기로 했다. 따뜻함은 모두의 것이어야 했고, 값은 우리가 치르면 된다고 믿었다. 벽에 붙은 그림자들은 그 값을 다 치른 이들이다.']},
f5:{s:'fire',t:'검은 원 아래에서',a:'별의 꼭대기, 얼어붙은 손에 쥐여 있던 수첩',at:['sp0'],x:[
'하늘의 저 검은 원은 일식이 아니다. 우리가 불을 떼어 낸 자리다. 하늘에도 살갗이 있다면, 저것은 아물지 않은 상처다.',
'불을 가져온 뒤로 저 구멍으로 찬 것이 조금씩 새어 들었다. 처음에는 한 해에 하루쯤 서리가 일찍 내리는 정도였다. 불이 약해질수록 구멍은 커졌다. 사람들은 이것을 칼셀바도르라고 부르기 시작했다.',
'우리는 불을 돌려주려고 이곳까지 올라왔다. 그런데 돌려줄 수가 없었다. 불은 이미 너무 많은 것을 먹었고, 그것들은 이제 불의 일부다. 돌려준다면 그 기억들도 함께 사라진다. 나는 여기서 기다리기로 한다. 누군가 이 원을 닫을 방법을 찾아올 때까지.']},
d1:{s:'dragon',t:'신과 용의 혼인',a:'용뼈 유적, 갈비뼈 안쪽에 걸린 파볼릭 성가집',at:['r1'],x:[
'태초에 땅은 용의 것이었다. 용은 땅속 깊은 곳의 불을 삼키고 그 불로 숨을 쉬었으며, 용이 숨을 쉬는 동안 산은 얼지 않았다.',
'한 신이 가장 큰 용과 정을 맺어 첫 파볼릭을 낳았다. 그래서 우리의 살갗은 비늘로 덮이고, 우리의 피에는 마력이 흐른다. 비늘의 색은 우리가 물려받은 불의 결이다. 남색은 물과 얼음을, 적동은 번개와 불을 기억한다.',
'성가는 이렇게 끝난다. “아비를 우러르라. 그리고 아비를 넘어서라.” 레타시아의 아이들은 이 구절을 외우며 자란다. 그래서 파볼릭은 용을 숭배하면서도 용을 죽이고 싶어 한다. 둘 다 같은 말에서 나왔다.']},
d2:{s:'dragon',t:'비늘의 법 — 성벽 법전 제7장',a:'무너진 파볼릭 초소 기록실의 법전 사본',at:['pos','po0'],x:[
'제7장 1조. 모든 파볼릭은 태어난 지 사흘 안에 비늘의 색을 신전에 고한다. 색은 곧 그 아이의 쓸모다.',
'제7장 4조. 비늘에 색이 없거나 자라면서 색이 바래는 자는 무색이라 한다. 무색은 마력을 나누지 못하므로 성의 불을 나누어서도 안 된다.',
'제7장 9조(칼셀바도르 첫해에 덧붙임). 장작이 모자라므로, 무색은 성벽 밖으로 내보낸다. 이를 거부하는 자는 프라우릴케가 처리한다. — 여백에 누군가 손톱으로 그어 놓았다. “나는 사흘째에 바랬다. 법은 나도 내보내라고 했다.”']},
d3:{s:'dragon',t:'감방 벽에 새긴 날짜들',a:'초소 지하 감옥, 바닥 돌 밑에 숨겨진 가죽 조각',at:['pod0'],x:[
'열하루째. 간수가 오늘은 물을 두 번 줬다. 옆 칸의 아이가 노래를 불러서다. 간수도 무색이었던 동생이 있었다고 한다.',
'서른째. 벽에 그은 줄이 손톱보다 길어졌다. 위층에서 칼라쉬들이 번개 시험을 한다. 바닥이 울릴 때마다 누군가 끌려 올라간다.',
'마흔둘째. 오늘 아이가 나갔다. 돌아오지 않았다. 나는 이 가죽에 아이가 부르던 노래 첫 줄을 적어 둔다. “비늘이 없어도 불은 따뜻하다.” 그 아이는 그 말을 믿었다. 나도 믿어 보기로 한다.']},
d4:{s:'dragon',t:'땅의 불이 먼저였다',a:'용의 두개골 안쪽, 마력으로 새긴 글귀를 옮겨 적은 공책',at:['r3','dn0'],x:[
'하늘의 불이 오기 전, 이 땅을 데운 것은 용의 불이었다. 용들은 땅속의 불을 나누어 삼키고 그 열기로 산과 강을 돌봤다.',
'마법사들이 하늘의 불을 가져오자 사람들은 더 이상 용을 필요로 하지 않았다. 용은 하나씩 사냥당했다. 마지막 남은 용들은 땅속 깊은 곳으로 숨었고, 땅의 불은 주인을 잃었다. 주인 잃은 불은 다른 것이 차지했다. 오래된 것, 길고 검은 것.',
'글귀 끝은 이렇다. “나는 잠든다. 불을 든 자가 오면 깨어나리라. 그가 내게 무엇을 줄지는 그가 정할 일이다.” 두개골의 주인은 이 글을 남긴 용이 아니다. 그를 지키다 죽은 형제다.']},
i1:{s:'song',t:'짐승이라 불린 세월',a:'엘가르드 의식터, 뼈 상자에 든 무두질한 노래 가죽',at:['g3','g1'],x:[
'우리는 오랫동안 짐승이라 불렸다. 인간의 마을에 들어가면 개처럼 쫓겨났고, 파볼릭은 우리 머리를 성벽 장식으로 걸었다. 우리는 말을 아꼈다. 말해도 들어 주는 이가 없었으므로.',
'칼셀바도르가 오자 모든 것이 바뀌었다. 길이 얼어붙자 인간들은 눈 위의 발자국을 읽는 우리가 필요했다. 죽은 자가 일어나자 영혼의 길을 아는 우리가 필요했다. 그들은 그제야 우리를 사람이라 불렀다.',
'노래의 마지막 소절은 이렇다. “추위가 모두를 짐승으로 만들자, 우리는 비로소 사람이 되었다. 그러니 봄이 오는 것을 두려워하라.”']},
i2:{s:'song',t:'얼굴 가린 자의 계율',a:'키야라드의 부족이 돌린 계율서, 한 장',at:['gs','g1'],x:[
'하나. 샤멘은 평생 얼굴을 가린다. 신은 얼굴 없는 자의 입을 빌려 말하므로.',
'둘. 샤멘은 신탁이 있을 때에만 입을 연다. 신탁이 없는 날의 말은 사람의 말이며, 사람의 말로 부족을 이끌어서는 안 된다.',
'셋. 카심은 샤멘의 곁을 떠나지 않는다. 샤멘이 죽으면 카심도 함께 묻힌다. — 계율서 뒷면에 다른 손글씨가 있다. “셋째 계율을 어긴 카심을 하나 안다. 그는 묻히는 대신 목소리를 빌려주기로 했다. 신이 그를 용서하실지는 모르겠다.”']},
i3:{s:'song',t:'굶주린 겨울의 노래',a:'늑대들의 무덤, 늙은 늑대 뼈 사이에 묻힌 노래 가죽',at:['wdg0'],x:[
'첫 겨울, 서리갈기는 사흘을 굶었다. 넷째 날 샤멘이 노래를 시작했다. 아이들은 잠들었고, 어른들은 울었다. 노래가 끝났을 때 천막 안에는 흰 털의 짐승들만 남아 있었다.',
'짐승은 사람보다 덜 먹고, 더 멀리 달리며, 추위에 죽지 않는다. 샤멘은 부족을 살리기 위해 부족을 지웠다.',
'노래는 하나를 남겨 둔다. 바뀌지 않은 아이 하나. 그 아이가 노래를 거꾸로 부르면 문이 다시 열린다. 다만 문이 열리면 굶주림도 함께 돌아온다. 그러니 언제 부를지는 아이가 정해야 한다.']},
i4:{s:'song',t:'커러브의 길노래',a:'순례자의 쉼터, 버려진 보따리 속 해진 노래책',at:['pc0','pcs'],x:[
'나는 부족을 떠났다. 그래서 신의 이름을 부를 수 없다. 대신 길 위의 것들 이름을 부른다. 얼어붙은 강, 무너진 다리, 이름 없는 무덤, 아직 연기가 나는 굴뚝.',
'노르드할에서는 노래 한 곡에 빵 반 덩이를 받았다. 하칸골에서는 노래를 부르다 쫓겨났다. 광부들은 위층에서 들려오는 노랫소리가 깊은 층의 무언가를 깨운다고 믿는다.',
'마지막 장에는 이런 구절이 있다. “제단까지 가는 이들에게 노래를 불러 주었다. 돌아오는 이들에게는 부르지 않았다. 돌아온 이들은 대개 내 노래를 기억하지 못했으니까.”']},
v1:{s:'stone',t:'슐리히만의 검은 비석',a:'옛 전장, 얼어붙은 기수의 품에서 나온 기도서',at:['n3'],x:[
'슐리히만은 맹세를 지켜보는 신이다. 벨데인은 맹세할 때 검은 비석에 손을 얹는다. 비석은 그 손의 온기를 기억했다가, 맹세를 어긴 날 차갑게 식는다.',
'도망친 자의 이름은 비석에서 지운다. 지워진 이름은 슐리히만의 기억에서도 지워진다고 한다. 그래서 벨데인에게 가장 큰 벌은 죽음이 아니라 망각이다.',
'기도서 마지막 장에 누군가 이름 둘을 적었다가 하나를 지웠다. 남은 이름 아래에는 이렇게 적혀 있다. “형의 이름으로 살겠다. 그러면 적어도 한 사람은 지워지지 않는다.”']},
v2:{s:'stone',t:'지워진 이름들',a:'늑대 굴에서 나온 사냥꾼의 가방 속 명부',at:['wd1','rm1'],x:[
'검붉은 늑대 씨족은 해마다 대회를 열고, 해마다 명부를 고친다. 이긴 자의 이름은 붉은 먹으로, 도망친 자의 이름은 칼로 긁어 지운다.',
'이 명부는 지운 이름을 버리지 않고 따로 모은 것이다. 누가 모았는지는 적혀 있지 않다. 이름마다 작은 글씨로 도망친 까닭이 붙어 있다. “아이가 아팠다.” “늑대가 아니라 사람을 베라고 했다.” “형이 먼저 쓰러졌다.”',
'명부 맨 끝 장. “나는 이름을 지우는 일을 서른 해 했다. 그동안 지운 이름 중에 겁쟁이는 몇 되지 않았다.”']},
v3:{s:'stone',t:'하칸 강철에 대하여',a:'검은 물의 끝, 버려진 연장 상자 속 제련서',at:['h3','h0'],x:[
'하칸은 새하얀 강철이다. 광석을 세 번 녹이고 세 번 두드려, 그 사이마다 눈 속에 묻어 식힌다. 그렇게 하면 쇠가 추위를 기억해 어떤 겨울에도 부러지지 않는다.',
'예전에는 장작이 광석보다 흔했다. 지금은 반대다. 하칸 한 자루를 벼리는 데 드는 장작이면 한 집이 겨울 열흘을 난다. 그래서 하칸골의 대장장이들은 망치를 들기 전에 먼저 누구의 겨울을 빌리는지 생각한다.',
'제련서 여백. “깊은 층의 물이 미지근하다. 저 아래에 장작 없이 타는 불이 있다면, 우리는 다시 마음껏 쇠를 두드릴 수 있을 것이다.” 그 아래에 다른 손으로 덧붙였다. “내려가지 마라.”']},
v4:{s:'stone',t:'갱도 일지 — 미지근한 물',a:'깊은 갱도, 짐승 굴 속에 떨어진 광부의 일지',at:['h1','h2'],x:[
'칼셀바도르 첫해 겨울. 위층은 얼었다. 아래로 내려갈수록 따뜻하다. 감독은 셋째 층까지만 허락했다.',
'둘째 해. 넷째 층에서 푸른 빛이 보였다. 그 근처에서 일한 이들은 밤마다 같은 꿈을 꾼다. 길고 검은 것이 귓가에서 무언가를 속삭이는 꿈. 다들 무슨 말이었는지는 기억하지 못한다.',
'셋째 해. 내 손톱이 발톱처럼 굽었다. 따뜻해서 좋다. 위로 올라가기 싫다. 이 일지를 누가 줍거든, 내 아들에게 아비는 따뜻한 곳에 있다고 전해 다오.']},
p1:{s:'pilgrim',t:'순례자의 기도서',a:'눈에 묻힌 예배당, 제단 위에 얼어붙은 작은 책',at:['prc0','prc1'],x:[
'제단으로 가는 길은 사흘이다. 첫날에는 먹을 것을 아끼고, 둘째 날에는 말을 아끼고, 셋째 날에는 기억을 아낀다.',
'불 앞에 서면 무엇을 바칠지 생각해 두어라. 불은 묻지 않고 가져간다. 미리 정해 둔 자만이 가장 소중한 것을 지킬 수 있다.',
'기도서 사이에 마른 꽃잎과 쪽지가 끼어 있다. “아이를 데려가요. 이 아이만은 다시 일어나게 해 주세요. 내 기억은 무엇이든 가져가도 좋아요.”']},
p2:{s:'pilgrim',t:'다시 일어난 자의 일기',a:'순례자의 무덤, 돌 밑에 묻힌 일기장',at:['pr1'],x:[
'첫 번째로 일어났다. 화톳불이 따뜻했다. 누이의 생일을 잊었다. 괜찮다. 적어 두면 된다.',
'네 번째. 고향 마을 이름이 생각나지 않는다. 일기 첫 장에 적어 둔 것을 읽었는데, 처음 보는 이름 같다.',

p3:{s:'pilgrim',t:'밤의 정원 꽃 이름',a:'밤의 정원, 정원지기의 오두막에 놓인 꽃 도감',at:['ng0'],x:[
